<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS logger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23e4e4e7' stroke-width='3' opacity='.45'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%23e4e4e7' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%23e4e4e7'/%3E%3Cpath d='M32 5v9M32 50v9M5 32h9M50 32h9' stroke='%23e4e4e7' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0c0d0f">
<!-- Status page of gps_logger.py, served from the board's flash as is.
     It loads once, then polls /status.json (every refresh_s from the JSON)
     and redraws the boxes. The map tiles (OSM-carto) come through the
     homelab Atlas proxy and the
     fonts from Google Fonts when the phone is online.
     The layout (Bator picked "A+C", 2026-11-10): the day's line beside the
     map (Google Timeline), then Logger, Sky and the diag log in columns
     split by hairlines (no card in a card), the device in one strip; mono
     labels and figures, place names in Inter; light or dark as the phone. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- (media=print + onload: the font sheet does not hold the first paint back
     when the phone has no internet; without scripts or fonts the page still
     renders in the system fonts) -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
<style>
:root{--b:#0c0d0f;--s:#1f2226;--l:rgba(255,255,255,.09);--t:#eceef0;--m:#9ba1a8;--ok:#4ade80;--mid:#c3e15a;--warn:#f5a524;--bad:#f87171;--rt:#2563eb;--rtx:#60a5fa;--midt:#c3e15a;
 --g0:#e4e4e7;--g2:#4ade80;--g3:#f5a524;--g6:#f472b6;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--b:#f3f3f1;--s:#e6e6e2;--l:rgba(0,0,0,.1);--t:#17181a;--m:#5d6268;--ok:#15803d;--mid:#5a9a0c;--warn:#b45309;--bad:#c62828;--rt:#2563eb;--rtx:#1e40af;--midt:var(--t);
 --g0:#3f3f46;--g2:#15803d;--g3:#b45309;--g6:#db2777;color-scheme:light}}
body{margin:0;background:var(--b);color:var(--t);font:14px/1.4 Inter,system-ui,sans-serif}
b{font-weight:600;font-variant-numeric:tabular-nums}
.bar,h3,.k b,.kp,.tr time,.tr span,.days,.btn,.kv span,.sg,.ev,.strip b,.ax,.lg,.svt,summary,.nc,.alert,.coord,.sl,.sm b{font-family:"JetBrains Mono",ui-monospace,monospace}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
/* the top bar: the board, LIVE (or why not), up and the firmware */
.bar{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;width:calc(min(1320px,100%) - 48px);margin:auto;padding:12px 0;border-bottom:1px solid var(--l);font-size:12px;letter-spacing:.08em}
.bar h1{font:600 13px "JetBrains Mono",monospace;letter-spacing:.14em;margin:0}
.live{color:var(--ok);font-weight:600}.live:before{content:"\25CF  "}.off .live{color:var(--warn)}
.up{margin-left:auto;color:var(--m)}
.pg{max-width:1320px;margin:auto;padding:0 24px 32px;transition:opacity .3s}.off .pg{opacity:.55}
h3{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--m);margin:0 0 14px;display:flex;justify-content:space-between;gap:12px;text-transform:uppercase}
h3 b{letter-spacing:.04em;color:var(--t)}h3 b.ok{color:var(--ok)}h3 b.warn{color:var(--warn)}h3 b.bad{color:var(--bad)}
.alert{margin-top:14px;padding:11px 14px;border:1px solid var(--bad);border-radius:10px;color:var(--bad);font-size:12px;font-weight:600;letter-spacing:.06em}
.alert em{font-style:normal;color:var(--t);font-weight:400;margin-left:8px}.alert:empty{display:none}
/* the position and the day beside the map */
.top{display:grid;grid-template-columns:420px 1fr;border-bottom:1px solid var(--l)}
.lc{padding:22px 24px 24px 0;border-right:1px solid var(--l);min-width:0}
.sl{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sl i{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px}.sl em{font-style:normal;color:var(--m)}
.now h2{font:600 24px/1.2 Inter,sans-serif;margin:10px 0 2px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now p.sub{color:var(--m);margin:0 0 14px}.now p:empty{display:none}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k span{font-size:12px;color:var(--m)}
.k b{display:block;font-size:19px;color:var(--t);white-space:nowrap}
.nc{margin:10px 0 0;font-size:11.5px;color:var(--m)}
.dh{display:flex;gap:6px;align-items:center;margin:20px 0 12px;padding-top:20px;border-top:1px solid var(--l)}.dh h3{margin:0 auto 0 0}
/* the day's buttons: they answer the pointer (hover lighter, a press sinks,
   a keyboard ring); the chips oldest first, today last, as the arrows step
   (< older, > newer), and they wrap: none cut off at the edge */
.btn{font-size:11px;font-weight:600;color:var(--t);background:var(--s);border:0;border-radius:6px;height:36px;min-width:36px;padding:0 10px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.days button{font:600 11.5px "JetBrains Mono",monospace;height:36px;padding:0 10px;border:0;border-radius:6px;background:var(--s);color:var(--m);cursor:pointer}
.btn:not(:disabled):hover,.days button:hover{filter:brightness(1.25)}.days button:hover{color:var(--t)}
.btn:not(:disabled):active,.days button:active{transform:translateY(1px)}
.btn:focus-visible,.days button:focus-visible,summary:focus-visible{outline:2px solid var(--rt);outline-offset:2px}
.tr.go:focus-visible{outline:2px solid var(--rt);outline-offset:-2px}  /* (inside: the rows touch) */
/* a finger's target: 44 px (a mouse keeps the compact 36) */
@media(pointer:coarse){.btn,.days button{height:44px;min-width:44px}}
.days .on,.days .on:hover{background:var(--t);color:var(--b);filter:none}
.kp{display:flex;gap:22px;margin-bottom:16px;transition:opacity .3s}.kp.busy{opacity:.45}.kp b{font-size:24px}.kp em{font-style:normal;font-size:12px;color:var(--m);margin-left:4px}
/* the day as a line: a solid stretch a trip, dashed a stop */
.tr{display:grid;grid-template-columns:48px 18px 1fr;min-height:30px;line-height:16px}
.tr time{font-size:12.5px;font-weight:600}.tr span{color:var(--m);padding-left:6px;font-size:12px}
.tr strong{color:var(--t);font:600 13px Inter,sans-serif}
.tr.pl{min-height:46px}
.tr i{position:relative}
.tr i:before{content:"";position:absolute;left:3px;top:2px;width:11px;height:11px;border-radius:50%;border:3px solid var(--rt);background:var(--b);box-sizing:border-box;z-index:1}
.tr i:after{content:"";position:absolute;left:7.5px;top:6px;bottom:-4px;border-left:2px dashed var(--l)}
.tr.go i:after{border-left:4px solid var(--rt);left:6.5px}
.tr.go{cursor:pointer}.tr.go:hover strong,.tr.go.on strong,.tr.go.on b{color:var(--rtx)}
/* no signal between two trips that start apart: dotted, not a stop */
.tr.gap i:after{border-left:2px dotted var(--m)}
.tr.end i:after{display:none}
.hint{margin:0;font-size:13px;color:var(--m)}.hint+.btn{margin-top:12px}
.ldg{margin:0 0 10px}
/* map */
.map{position:relative;overflow:hidden;min-height:560px;margin:16px 0 16px 24px;border-radius:14px;background:#e8e4dc}
.tiles{position:absolute;left:50%;top:50%}  /* the Atlas map as it is, its own colours */
.tiles img{position:absolute;width:256px;height:256px}
/* the position as a navigation app shows it: a blue dot in a white ring,
   the accuracy as a pale disc, a cone the way it moves */
.acc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(59,130,246,.4);background:rgba(59,130,246,.14);z-index:2}
.pin{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-sizing:border-box;box-shadow:0 1px 5px rgba(0,0,0,.45);z-index:3}
.pin:after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(37,99,235,.55);animation:p 2s infinite}
.cone{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:2;display:none;
 background:radial-gradient(circle,rgba(59,130,246,.55) 12%,rgba(59,130,246,0) 70%);clip-path:polygon(50% 50%,29% 0,71% 0)}
.cone.on{display:block}
@keyframes p{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
.nofix .pin,.nofix .acc,.nofix .cone{display:none}
/* without a fix: the reason in the middle */
.coord{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:600;color:#b45309;background:rgba(255,255,255,.9);padding:4px 8px;border-radius:5px;z-index:4;white-space:nowrap;display:none}
.nofix .coord{display:block}
.trk{position:absolute;left:50%;top:50%;z-index:1;pointer-events:none}
.trk svg{position:absolute;overflow:visible}
.trk circle{stroke-width:3;vector-effect:non-scaling-stroke}
.trk circle.s{fill:#fff;stroke:#2563eb}.trk circle.e{fill:#2563eb;stroke:#fff}
.trk path{fill:none;stroke:#2563eb;stroke-width:4;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.trk path.c{stroke:#fff;stroke-width:7}
.trk path.hl{stroke:#1e40af;stroke-width:6}.trk path.hl.c{stroke:#fff;stroke-width:10}
.attr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#444;background:rgba(255,255,255,.75);padding:0 4px;border-radius:3px;z-index:4}
.attr a{color:inherit;position:relative}
.attr a:after{content:"";position:absolute;left:-2px;right:-2px;top:-15px;bottom:-15px}  /* a 44 px target */
/* Logger, Sky, the diag log: columns split by hairlines */
.cols{display:grid;grid-template-columns:1fr 1fr 1.15fr;border-bottom:1px solid var(--l)}
.cols>section{padding:22px 24px 24px;border-left:1px solid var(--l);min-width:0}
.cols>section:first-child{border-left:0;padding-left:0}.cols>section:last-child{padding-right:0}
.big{margin:0 0 12px;font:600 32px Inter,sans-serif;letter-spacing:-.02em}
.big em{font:400 13px Inter,sans-serif;color:var(--m);font-style:normal;margin-left:8px;letter-spacing:0}
.kv div{display:grid;grid-template-columns:9px 92px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--l);align-items:baseline;font-size:13px}
.kv i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block;align-self:center}
.kv .warn i{background:var(--warn)}.kv .bad i{background:var(--bad)}
.kv span{color:var(--m);font-size:12px;overflow-wrap:anywhere}
.kv em{font-style:normal;font-weight:600;font-size:12px}.kv .warn em{color:var(--warn)}.kv .bad em{color:var(--bad)}
.wi{width:16px;height:12px;margin-right:6px;vertical-align:-1px;color:var(--t);fill:none;stroke-width:2.4;stroke-linecap:round}
.wi path{stroke:var(--l)}.wi .on{stroke:currentColor}.wi circle{fill:currentColor;stroke:none}
/* sky: the plot (elevation rings, a dot a satellite: its system's colour,
   bigger = clearer, hollow when not in use) and the ones in use as bars */
.skg{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center}
.skg svg{display:block;width:100%;height:auto}
.rg{fill:none;stroke:var(--l)}
text{fill:var(--m);font:600 9px Inter,sans-serif;text-anchor:middle}
circle[class^=g],circle[class*=" g"]{fill:var(--s);stroke:var(--s);stroke-width:1.2}
[class^=g],[class*=" g"]{--s:var(--m)}.g0{--s:var(--g0)}.g2{--s:var(--g2)}.g3{--s:var(--g3)}.g6{--s:var(--g6)}
circle.u{fill:none;opacity:.6}
.sg p{margin:0;display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;height:17px;font-size:11.5px;color:var(--m)}
.sg s{display:block;height:6px;border-radius:3px;background:currentColor}
.q-strong{color:var(--ok)}.q-fair{color:var(--mid)}b.q-fair{color:var(--midt)}.q-weak{color:var(--warn)}.q-none{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--m);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--s);margin-right:5px}
.legend .u i{background:none;border:1.5px solid var(--m);box-sizing:border-box}
.note{color:var(--m);font-size:12px;margin:10px 0 0}
/* the diag log: the summary, the accuracy dot matrix with the receiver link
   under it, the events by kind */
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-bottom:16px}
.sm small{display:block;font-size:11.5px;color:var(--m)}.sm b{font-size:14px}.sm em{font-style:normal;color:var(--m);font-size:11.5px;margin-left:4px}
.dm{display:flex;gap:2px;height:96px;align-items:flex-end}
.dm i{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;min-width:0}
.dm s{flex:1;background:var(--l);border-radius:1px}.dm s.ok{background:var(--ok)}.dm s.am{background:var(--mid)}.dm s.rd{background:var(--warn)}
.dm i.x s:first-child{background:var(--bad)}
.lk{display:flex;gap:2px;height:6px;margin-top:4px}.lk i{flex:1;min-width:0;background:var(--l)}.lk .ok{background:var(--ok)}.lk .am{background:var(--warn)}.lk .rd{background:var(--bad)}
.mk{position:relative;height:20px;margin-top:2px}.mk span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--bad);white-space:nowrap;font-family:"JetBrains Mono",monospace}
.mk i{display:block;width:0;height:0;margin:0 auto 2px;border:4px solid transparent;border-bottom-color:var(--bad);border-top:0}
.ax{display:flex;justify-content:space-between;color:var(--m);font-size:11px;margin-top:6px}
.lg{display:flex;gap:12px;color:var(--m);font-size:11px;margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:8px;height:8px;margin-right:5px;background:var(--ok)}
.lg .am{background:var(--mid)}.lg .rd{background:var(--warn)}.lg .x{background:var(--bad)}
.ev{margin-top:14px}
.er{display:grid;grid-template-columns:80px 1fr 72px 44px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--l);font-size:12px}
.er>*{min-width:0}.er time{color:var(--m);white-space:nowrap}
.er span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.er span em{font-style:normal;color:var(--m)}
.er b{text-align:right}
.sk{display:flex;gap:1px;align-items:flex-end;height:14px}.sk i{flex:1;background:var(--l);min-height:2px}.sk i.on{background:currentColor}
.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}.t-ok{color:var(--ok)}.t-boot{color:var(--t)}.t-mut{color:var(--m)}
.none{font-size:12px;color:var(--m)}
/* the device in one strip; every satellite in a table */
.strip{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:12px 24px;padding:18px 0;border-bottom:1px solid var(--l)}
.strip small{display:block;font-size:12px;color:var(--m);margin-bottom:3px}.strip b{font-weight:400;font-size:13px}
.strip .warn b{color:var(--warn)}
details{padding:4px 0 16px}
summary{cursor:pointer;padding:15px 0;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--m);text-transform:uppercase}
.svt{width:100%;max-width:640px;border-collapse:collapse;font-size:12px;margin-top:10px}
.svt td{padding:3px 6px;border-top:1px solid var(--l);text-align:right}
.svt td:first-child{text-align:left}.svt .u td{color:var(--m)}
/* nothing that moves for those who asked for less motion */
@media(prefers-reduced-motion:reduce){.pin:after{animation:none;display:none}.pg,.kp{transition:none}}
/* a phone: one column, the map first */
@media(max-width:900px){.bar{width:calc(100% - 24px);gap:4px 12px}.off .up{display:none}.pg{padding:0 12px 24px}
.top{grid-template-columns:1fr}.lc{padding:18px 0;border-right:0}.map{order:-1;min-height:0;height:300px;margin:12px 0 0}
.k b{font-size:17px}.cols{grid-template-columns:1fr}.cols>section{border-left:0;border-top:1px solid var(--l);padding:18px 0}
.cols>section:first-child{border-top:0}.skg{grid-template-columns:1fr}.skg svg{max-width:230px;margin:auto}
.strip{grid-template-columns:1fr 1fr}.er{grid-template-columns:80px 1fr 44px}.er .sk{display:none}}
/* a tablet: Logger and Sky side by side, the diag log under them */
@media(min-width:600px) and (max-width:900px){.cols{grid-template-columns:1fr 1fr}
.cols>section:nth-child(2){border-left:1px solid var(--l);padding-left:18px}.cols>section:first-child{padding-right:18px}
.cols>section:nth-child(2){border-top:0}.cols>section:last-child{grid-column:1/-1}.skg svg{max-width:200px}}
</style>
</head>
<body>
<div class="bar"><h1 id="dev">GPS LOGGER</h1><span class="live" id="live">LIVE</span><span class="up" id="up"></span></div>
<div class="pg" id="wrap">
  <div class="alert" id="gl"></div>
  <div class="top">
    <div class="lc">
      <div class="now"><p class="sl" id="st"></p><h2 id="nst">connecting&hellip;</h2><p class="sub" id="nsub"></p><div class="k" id="nr"></div><p class="nc" id="ncoord"></p></div>
      <div class="dh"><h3>Day</h3><button class="btn" id="dprev" aria-label="Older day" onclick="step(-1)">&lsaquo;</button><button class="btn" id="dnext" aria-label="Newer day" onclick="step(1)">&rsaquo;</button><button class="btn" id="gpx" onclick="gpxSave()">GPX</button></div>
      <div class="days" id="days"></div>
      <div class="kp" id="tkpi"></div><div id="tline"></div>
    </div>
    <div class="map nofix" id="map">
      <div class="tiles" id="tiles"></div><div class="trk" id="trk"></div>
      <div class="acc" id="acc"></div><div class="cone" id="cone"></div><div class="pin" id="pin"></div><div class="coord" id="coord">connecting&hellip;</div>
      <div class="attr">&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &middot; <a href="https://www.geoapify.com/">Geoapify</a></div>
    </div>
  </div>
  <div class="cols">
    <section><h3>Logger <b id="hok"></b></h3><div id="sys"></div></section>
    <section><h3 id="skyh">Sky</h3>
      <div class="skg"><svg viewBox="-104 -104 208 208">
        <circle class="rg" r="90"/><circle class="rg" r="60"/><circle class="rg" r="30"/>
        <path class="rg" d="M0-90V90M-90 0H90"/>
        <text y="-94">N</text><text x="97" y="3">E</text><text y="101">S</text><text x="-97" y="3">W</text>
        <g id="dots"></g>
      </svg><div class="sg" id="sig"></div></div><div class="note" id="sgn"></div>
      <div class="legend"><span class="g0"><i></i>GPS</span><span class="g2"><i></i>Galileo</span><span class="g3"><i></i>BeiDou</span><span class="g6"><i></i>GLONASS</span><span class="g1"><i></i>other</span><span class="u"><i></i>not used</span></div>
    </section>
    <!-- the whole diag log on the board, aggregated: the summary, accuracy and the receiver link, events by kind -->
    <section><h3>Diag log <b id="evs">reading&hellip;</b></h3><div id="evk"></div><div id="evt"></div><div class="ev" id="evg"></div></section>
  </div>
  <div class="strip" id="dl"></div>
  <details><summary id="svh">All satellites</summary><table class="svt" id="svt"></table></details>
</div>
<script>
var GNSS = {GPS: 0, SBAS: 1, Galileo: 2, BeiDou: 3, QZSS: 5, GLONASS: 6};
// machine.reset_cause() of MicroPython 1.29 on the ESP32: 1 also a brownout,
// 2 also machine.reset() and a panic, 0 a USB/JTAG or unknown reset
var BOOT = {0: "other reset", 1: "power on", 2: "hard reset", 3: "watchdog", 4: "deep sleep", 5: "soft reset"};
var TLS_KB = 48;                        // TLS_MIN_KB in gps_logger.py
var POINT_B = 7;                        // bytes per .trb point (7.0-7.3 on a 1 Hz drive; .trk ~46-51)
var UERE = 2.5;                         // m per HDOP unit for the accuracy ring
var ZOOM = 17, FIT_X = 36;              // px kept free at the map's sides
// the map tiles: OSM-carto through the homelab Atlas proxy (CT 146 adds the
// Geoapify key; Cloudflare caches the tiles); it answers pages on a
// private-network address, as the board's is
var TILES = "https://atlas.crusand.org/tiles/geoapify/";
// the address of the position: Atlas' Photon (reverse geocoding), asked
// again only after ADDR_M metres and ADDR_S seconds
var ADDR = "https://atlas.crusand.org/api/v1/photon/reverse";

    trkKey = key + "/" + hist.pts.length + "/" + hist.hl;
    var hr = hlRange();
    var dd = histPath(t, z), dh = hr ? histPath(t, z, hr[0], hr[1]) : "";
    trk.innerHTML = hist.pts.length ? '<svg width="1" height="1"><path class="c" d="' + dd + '"/><path d="' + dd + '"/>' +
      (hr ? '<path class="hl c" d="' + dh + '"/><path class="hl" d="' + dh + '"/>' : "") +
      ends(t, z, hr ? hr[0] : 0, hr ? hr[1] : hist.pts.length - 1, sc) + "</svg>" : "";
  }
  // the ring's radius: HDOP * UERE
  var acc = document.getElementById("acc"), px = (accM(d) || 0) * 2 / t.mpp;
  acc.style.width = acc.style.height = Math.max(36, Math.round(px)) + "px";
}

// metres between two [_, lat, lon] points
function metres(a, b) {
  var c = Math.cos(a[1] * Math.PI / 180);
  return 1000 * Math.sqrt(Math.pow((a[1] - b[1]) * 110.54, 2) + Math.pow((a[2] - b[2]) * 111.32 * c, 2));
}
// Photon's answer -> {st: street and number (or the place's name), sub:
// district, city}; null when it names nothing (pure, for tests)
function addrOf(j) {
  var f = j && j.features && j.features[0], p = f && f.properties;
  if (!p) return null;
  var st = p.street ? p.street + (p.housenumber ? " " + p.housenumber : "") : p.name || "";
  var sub = [p.street && p.name ? p.name : "", p.district || p.locality || "", p.city || p.county || ""];
  sub = sub.filter(function (x, i) { return x && sub.indexOf(x) === i && x !== st; });
  return st ? {st: st, sub: sub.join(", ")} : null;
}
// From today's track: how long the position has stayed within r metres
// (ms, null when the track does not end there; a stray fix outside for
// under STRAY_MS does not end the stay), and the speed over its last
// minute (km/h; 0 standing, null when the track is not current)
var STRAY_MS = 120000;
function hereFor(pts, lat, lon, r, now) {
  var n = pts.length, me = [0, lat, lon], i = n - 1;
  if (!n || hist.past || metres(pts[n - 1], me) > r) return {ms: null, kmh: null};
  for (var k = n - 2; k >= 0; k--) {
    if (metres(pts[k], me) <= r) { i = k; continue; }
    if (pts[i][0] - pts[k][0] > STRAY_MS) break;
  }
  var ms = now - pts[i][0], kmh = ms >= 60000 ? 0 : null;
  if (kmh === null && now - pts[n - 1][0] < 120000) {
    var j = n - 1;
    while (j > 0 && pts[n - 1][0] - pts[j - 1][0] <= 60000) j--;
    var dt = pts[n - 1][0] - pts[j][0], dm = 0;
    for (var m = j + 1; m < n; m++) dm += metres(pts[m - 1], pts[m]);
    kmh = dt > 0 ? dm / dt * 3600 : 0;
  }
  return {ms: ms, kmh: kmh};
}
// the heading (degrees from north) over the track's last 30 m; null if shorter
function heading(pts) {
  var n = pts.length, i = n - 1;
  if (n < 2) return null;
  while (i > 0 && metres(pts[i], pts[n - 1]) < 30) i--;
  if (metres(pts[i], pts[n - 1]) < 30) return null;
  var a = pts[i], b = pts[n - 1], c = Math.cos(b[1] * Math.PI / 180);
  return (Math.atan2((b[2] - a[2]) * c, b[1] - a[1]) * 180 / Math.PI + 360) % 360;
}
// the now block's HTML (pure, for tests): addr from addrOf, h from hereFor; a
// status line (moving or standing, the fix, the satellites), the address,
// here for / speed / accuracy / last fix, the coordinates under them
function nowCard(d, addr, h, coords) {
  var ha = accM(d), fx = d.fix || "-", sats = String(d.sats || "- / -").replace(/None/g, "-").split(" / ");
  var k = function (val, lab, cls) { return "<div" + (cls ? ' class="' + cls + '"' : "") + "><b>" + val + "</b><span>" + lab + "</span></div>"; };
  // (no track today: the board's own "staying" says it stands)
  var still = h.kmh === null && d.stay === "yes", word = h.kmh >= 3 ? "Moving" : h.kmh !== null || still ? "Standing still" : "Position";
  return {st: '<span class="' + fixTone(fx) + '"><i></i>' + word + "</span> <em>&middot; " + esc(fx) + " &middot; " + esc(sats[1]) +
      " of " + esc(d.satellites ? d.satellites.length : sats[0]) + " satellites</em>",
    nst: addr ? esc(addr.st) : coords, nsub: addr ? esc(addr.sub) : "",
    nr: (h.ms !== null ? k(esc(hms(h.ms / 1000)), "here for") : "") + k(h.kmh === null ? (still ? "0 km/h" : "&ndash;") : Math.round(h.kmh) + " km/h", "speed") +
      k(ha === null ? "&ndash;" : "&plusmn;" + Math.round(ha) + " m", "accuracy") +
      (typeof d.good_age_s === "number" ? k(d.good_age_s + " s", "last fix", "fa") : ""),
    ncoord: addr ? coords : ""};
}
// the address: asked when the position moved ADDR_M metres, at most every
// ADDR_S seconds; the card shows the coordinates until (or if never) known
var addr = {at: null, t: 0, a: null, busy: false};
function addrLoad(lat, lon) {
  var me = [0, lat, lon];
  if (addr.busy || addr.at && metres(addr.at, me) < ADDR_M || Date.now() - addr.t < ADDR_S * 1000) return;
  var x = new XMLHttpRequest();
  addr.busy = true;
  addr.t = Date.now();
  x.open("GET", ADDR + "?lat=" + lat.toFixed(5) + "&lon=" + lon.toFixed(5) + "&limit=1", true);
  x.timeout = 8000;
  x.onload = function () {
    addr.busy = false;
    var a = null;
    try { a = x.status === 200 ? addrOf(JSON.parse(x.responseText)) : null; } catch (e) { a = null; }
    if (a) { addr.a = a; addr.at = me; if (mapD) nowPaint(mapD, lat, lon); }
  };
  x.onerror = x.ontimeout = function () { addr.busy = false; };
  x.send();
}
function nowPaint(d, lat, lon) {
  var acc = accM(d) || 0;
  // within 100 m (an indoor fix strays that far), more on a poor one
  var h = hereFor(hist.pts, lat, lon, Math.max(100, 3 * acc), Date.now());
  // an address is the position's while within ADDR_M (else coordinates)
  var a = addr.a && addr.at && metres(addr.at, [0, lat, lon]) < 4 * ADDR_M ? addr.a : null;
  // the coordinates as the status painted them (view() runs first)
  paint(nowCard(d, a, h, (drawn.coord || "").replace(/ &middot; &plusmn;.*$/, "")));
  var hd = h.kmh !== null && h.kmh >= 3 ? heading(hist.pts) : null, cone = document.getElementById("cone");
  cone.className = hd === null ? "cone" : "cone on";
  cone.style.transform = hd === null ? "" : "rotate(" + hd.toFixed(0) + "deg)";
  addrLoad(lat, lon);
}

var last = 0, every = 15, prevD = null, drawn = {};
// a box rewritten only when its HTML changed: drawn holds what was written
// (innerHTML reads back normalised, &middot; as U+00B7: it always differed)
function paint(v) {
  for (var id in v) {
    if (drawn[id] === v[id]) continue;
    var e = document.getElementById(id);
    if (e) { e.innerHTML = v[id]; drawn[id] = v[id]; }
  }
}
function stale() {
  document.body.className = "off";
  document.getElementById("live").innerHTML = last ? "OFFLINE &middot; " + esc(hms((Date.now() - last) / 1000).toUpperCase()) +
    " AGO" : "NO ANSWER";
}
function tick() {
  var x = new XMLHttpRequest();
  x.open("GET", "/status.json", true);
  x.timeout = 10000;
  x.onload = function () {
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) {
      stale();
      // the board answered, not gone: a bug building the JSON (500) or one of
      // its own text/plain errors (403, 404, 503): its words, with the status.
      // A gateway's or a captive portal's page (HTML, 502, 504...) is not the
      // board's: that stays OFFLINE
      var ct = x.status ? String(x.getResponseHeader("Content-Type") || "") : "";
      if (x.status === 500 || x.status && x.status !== 200 && /^text\/plain/i.test(ct))
        document.getElementById("live").innerHTML = "BOARD ERROR &middot; " +
          (x.status === 500 ? "" : "HTTP " + x.status + " ") + esc(String(x.responseText).slice(0, 60));
    }
    // a bug drawing a box is not the board gone: LIVE stays, the error shows
    if (d) try {
      every = d.refresh_s || 15;
      last = Date.now();
      document.body.className = "";
      document.getElementById("live").innerHTML = "LIVE";
      paint(view(d, prevD));
      prevD = d;
      boardDays = d.days || [];
      boardSpans = d.day_span || {};
      navPaint();
      placeMap(d);
      placeNext();                      // (a place asked in vain: again after PLACE_WAIT)
      if (histDue()) histLoad();
      if (diagDue()) diagLoad();
    } catch (e) {
      document.getElementById("live").innerHTML = "LIVE &middot; PAGE ERROR " + esc(String(e && e.message || e)).slice(0, 60);
    }
    setTimeout(tick, every * 1000);
  };
  x.onerror = x.ontimeout = function () { stale(); setTimeout(tick, every * 1000); };
  x.send();
}
if (typeof document !== "undefined") {
  window.onresize = function () { if (mapD) placeMap(mapD); };
  tick();
}
</script>
