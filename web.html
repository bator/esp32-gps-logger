<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS logger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060b16'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2322d3ee' stroke-width='3' opacity='.45'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%2322d3ee'/%3E%3Cpath d='M32 5v9M32 50v9M5 32h9M50 32h9' stroke='%2322d3ee' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#060b16">
<!-- Status page of gps_logger.py, served from the board's flash as is.
     It loads once, then polls /status.json (every refresh_s from the JSON)
     and redraws the boxes. The map tiles come from OpenStreetMap and the
     fonts from Google Fonts when the phone is online. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{--b:#060b16;--l:#16233d;--t:#d6e2ff;--m:#7487ae;--a:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
body{margin:0;background:var(--b);color:var(--t);font:14px Inter,system-ui,sans-serif}
.tm,.sys,.term,.p h2,.hud,.coord,.legend,.svt{font-family:"JetBrains Mono",ui-monospace,monospace}
/* map */
.map{position:relative;height:360px;overflow:hidden;background:#0a1222}
.tiles{position:absolute;left:50%;top:42%;filter:invert(1) hue-rotate(195deg) saturate(.35) brightness(.62) contrast(1.15)}
.tiles img{position:absolute;width:256px;height:256px}
.map:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,11,22,.55) 0,rgba(6,11,22,0) 22%,rgba(6,11,22,0) 55%,var(--b) 100%),radial-gradient(circle at 50% 42%,rgba(34,211,238,.1),transparent 45%)}
.grid{position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:40px 40px}
.acc{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(34,211,238,.6);background:radial-gradient(circle,rgba(34,211,238,.18),rgba(34,211,238,.04) 70%);z-index:2}
.pin{position:absolute;left:50%;top:42%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px rgba(34,211,238,.25),0 0 22px var(--a);z-index:3}
.pin:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(34,211,238,.5);animation:p 2s infinite}
@keyframes p{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
.nofix .pin,.nofix .acc{display:none}
.coord{position:absolute;left:50%;top:42%;transform:translate(16px,-34px);font-size:11px;font-weight:600;color:var(--a);z-index:4;white-space:nowrap;text-shadow:0 0 8px rgba(34,211,238,.6)}
.nofix .coord{transform:translate(-50%,-50%);color:var(--warn);text-shadow:none;font-size:13px}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:4;max-width:1100px;margin:auto;box-sizing:border-box}
.hud h1{font-size:14px;font-weight:700;letter-spacing:.18em;margin:0;color:#fff}
.live{font-size:11px;font-weight:600;color:var(--ok);letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.off .live{color:var(--warn)}
.hud .up{margin-left:auto;color:var(--m);font-size:12px}
.trk{position:absolute;left:50%;top:42%;z-index:1;pointer-events:none}
.trk svg{position:absolute;overflow:visible}
.trk path{fill:none;stroke:#22d3ee;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 0 4px rgba(34,211,238,.7))}
.hud .day{color:var(--a);font-size:11px;font-weight:600;letter-spacing:.1em;white-space:nowrap}.hud .day em{font-style:normal}
.attr{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--m);z-index:4}
.attr a{color:inherit}
/* panels */
.wrap{max-width:1100px;margin:-96px auto 0;padding:0 16px 18px;position:relative;z-index:5;transition:opacity .3s}
.off .wrap{opacity:.5}
.tm{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:14px;overflow:hidden}
.tm div{background:rgba(10,19,38,.9);padding:11px 12px;min-width:0}
.tm small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--m)}
.tm b{display:block;font-size:22px;color:#fff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm b em,.sys em{font-style:normal;font-size:11px;color:var(--m);margin-left:4px}
.wi{width:25px;height:19px;margin-right:8px;vertical-align:-1px;color:var(--a);fill:none;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 4px currentColor)}
.wi path{stroke:rgba(116,135,174,.28)}.wi .on{stroke:currentColor}.wi circle{fill:currentColor;stroke:none}
.tm b em.db{margin-left:10px}
.tm .warn .wi,.tm .bad .wi{color:inherit}
.tm .ok b{color:var(--ok);text-shadow:0 0 12px rgba(52,211,153,.5)}
.tm .warn b,.sys .warn{color:var(--warn)}.tm .bad b,.sys .bad{color:var(--bad)}
.g{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-top:12px}
.p{background:linear-gradient(180deg,rgba(18,32,60,.75),rgba(9,16,32,.85));border:1px solid var(--l);border-radius:14px;padding:14px}
.p h2{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--m);margin:0 0 10px;text-transform:uppercase}
.col{display:flex;flex-direction:column;gap:12px}.col .p:last-child{flex:1}
/* sky radar */
.radar svg{display:block;width:100%;max-width:380px;margin:auto}
.rg{fill:none;stroke:rgba(34,211,238,.18)}.rx{stroke:rgba(34,211,238,.12)}
.sweep{fill:url(#sw)}
text{fill:var(--m);font:600 9px "JetBrains Mono",monospace;text-anchor:middle}
[class^=g],[class*=" g"]{--s:#94a3b8}.g0{--s:#38bdf8}.g2{--s:#34d399}.g3{--s:#fbbf24}.g6{--s:#f472b6}
circle[class^=g],circle[class*=" g"]{fill:var(--s);stroke:var(--s);stroke-width:1.2;filter:drop-shadow(0 0 4px var(--s))}
circle.u{fill:none;filter:none;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--m);margin-top:8px;justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--s);box-shadow:0 0 6px var(--s);margin-right:5px}
.legend .u i{background:none;border:1.5px solid var(--m);box-shadow:none;box-sizing:border-box}
/* signal */
.r{display:flex;align-items:flex-end;gap:2px;height:90px;background:linear-gradient(rgba(34,211,238,.1),rgba(34,211,238,.1)) 0 0/100% 1px no-repeat,linear-gradient(rgba(34,211,238,.1),rgba(34,211,238,.1)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(34,211,238,.1),rgba(34,211,238,.1)) 0 66.67%/100% 1px no-repeat}
.r i{flex:1;min-height:2px;background:linear-gradient(0deg,var(--s),transparent 140%);box-shadow:0 0 6px var(--s)}
.r .u{opacity:.25;box-shadow:none}
/* systems */
.sys{font-size:12px;color:var(--m);display:flex;justify-content:space-between;gap:10px;margin-top:9px}
.sys:first-child{margin-top:0}
.sys span{color:#fff;text-align:right}
.bar{position:relative;height:6px;background:var(--l);border-radius:3px;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--a);box-shadow:0 0 8px var(--a)}
.bar.bad i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.bar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--warn)}
/* log + satellite table */
.term{font-size:12.5px;line-height:1.75;color:#9fb3da;overflow-x:auto;white-space:nowrap}
.term .t{color:var(--m)}.term .ok{color:var(--ok)}.term .boot{color:var(--a)}.term .err{color:var(--bad)}.term .warn{color:var(--warn)}.term .info{color:#c4b5fd}
details.p{margin-top:12px}
details summary{cursor:pointer;font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.16em;color:var(--m);text-transform:uppercase}
.svt{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.svt td{padding:3px 6px;border-top:1px solid var(--l);text-align:right}
.svt td:first-child{text-align:left}.svt .u td{color:var(--m)}
@media(max-width:760px){.hud .day em{display:none}.tm{grid-template-columns:repeat(3,1fr)}.tm b{font-size:19px}.tm .db{display:none}.wi{width:18px;height:14px;margin-right:5px}.g{grid-template-columns:1fr}.map{height:300px}.wrap{margin-top:-70px}.coord{transform:translate(-50%,16px)}}
</style>
</head>
<body>
<div class="map nofix" id="map">
  <div class="tiles" id="tiles"></div><div class="grid"></div><div class="trk" id="trk"></div>
  <div class="acc" id="acc"></div><div class="pin" id="pin"></div><div class="coord" id="coord">connecting&hellip;</div>
  <div class="hud"><h1>GNSS&middot;TELEMETRY</h1><span class="live" id="live">LIVE</span><span class="day" id="day"></span><span class="up" id="up"></span></div>
  <div class="attr">&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></div>
</div>
<div class="wrap">
  <div class="tm" id="tm"></div>
  <div class="g">
    <div class="p radar"><h2 id="skyh">Sky</h2>
      <svg viewBox="-104 -104 208 208">
        <defs><radialGradient id="sw" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="scale(90)"><stop offset="0" stop-color="rgba(34,211,238,.18)"/><stop offset="1" stop-color="rgba(34,211,238,0)"/></radialGradient></defs>
        <path class="sweep" d="M0 0L0-90A90 90 0 0 1 77.9-45Z"/>
        <circle class="rg" r="90"/><circle class="rg" r="60"/><circle class="rg" r="30"/>
        <path class="rx" d="M0-90V90M-90 0H90M-63.6-63.6L63.6 63.6M63.6-63.6L-63.6 63.6"/>
        <text y="-94">N</text><text x="97" y="3">E</text><text y="101">S</text><text x="-97" y="3">W</text>
        <g id="dots"></g>
      </svg>
      <div class="legend"><span class="g0"><i></i>GPS</span><span class="g2"><i></i>GAL</span><span class="g3"><i></i>BDS</span><span class="g6"><i></i>GLO</span><span class="g1"><i></i>OTHER</span><span class="u"><i></i>NOT USED</span></div>
    </div>
    <div class="col">
      <div class="p"><h2 id="bh">Signal &middot; dBHz</h2><div class="r" id="bars"></div></div>
      <div class="p"><h2>Systems</h2><div id="sys"></div></div>
    </div>
  </div>
  <div class="p" style="margin-top:12px"><h2>Event log</h2><div class="term" id="log"></div></div>
  <details class="p"><summary id="svh">Satellite table</summary><table class="svt" id="svt"></table></details>
</div>
<script>
var GNSS = {GPS: 0, SBAS: 1, Galileo: 2, BeiDou: 3, QZSS: 5, GLONASS: 6};
// machine.reset_cause() of MicroPython 1.29 on the ESP32: 1 also a brownout,
// 2 also machine.reset() and a panic, 0 a USB/JTAG or unknown reset
var BOOT = {0: "other reset", 1: "power on", 2: "hard reset", 3: "watchdog", 4: "deep sleep", 5: "soft reset"};
var TLS_KB = 48;                        // TLS_MIN_KB in gps_logger.py
var POINT_B = 51;                       // bytes per .trk point (TRK2; TRK1 ~46)
var UERE = 2.5;                         // m per HDOP unit for the accuracy ring
var MAX_HACC = 20;                      // PVT_MAX_HACC in gps_logger.py
var ZOOM = 17;
// every status.json key the page shows (tests check none is missing)
var SHOWN = ("fix sats hdop hacc fix_src ubx utc position nmea gps_boots gps_loops receiver setup_ok points left files " +
  "bad_files sent upload upload_err stay uptime prev_run boot_cause temp mhz mem heap_kb idf flash_kb " +
  "wifi rssi pulses").split(" ");
var OTHER = ["device", "refresh_s", "diag", "satellites", "satellites_age_s", "prev_uptime"];

function esc(v) {
  if (v === null || v === undefined) return "-";
  if (v === true) return "yes";
  if (v === false) return "no";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function nn(s) { return s === undefined || s === "" || s === "None" || s === "-" ? null : s; }   // Python None in a text
function two(n) { return (n < 10 ? "0" : "") + n; }
function hms(s) {                       // as _hms() in gps_logger.py
  if (s === null || s === undefined) return "-";
  s = Math.floor(s);
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min " + two(s % 60) + " s";
  if (s < 86400) return Math.floor(s / 3600) + " h " + two(Math.floor(s / 60) % 60) + " min";
  return Math.floor(s / 86400) + " d " + two(Math.floor(s / 3600) % 24) + " h";
}
function num(n) { return n === null || n === undefined ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function gid(sv) { return GNSS[sv.system] === undefined ? 1 : GNSS[sv.system]; }
function cls(sv) { return "g" + gid(sv) + (sv.used ? "" : " u"); }
function tip(sv) { return esc(sv.name) + " " + (sv.cno || "-") + " dBHz"; }
function fixTone(fix) { return fix.indexOf("3D") === 0 ? "ok" : fix.indexOf("fix") >= 0 ? "warn" : "bad"; }
function tile(lat, lon, z) {            // slippy-map tile and pixel offset in it
  var n = Math.pow(2, z), r = lat * Math.PI / 180;
  var x = (lon + 180) / 360 * n, y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
  return {x: Math.floor(x), y: Math.floor(y), fx: (x - Math.floor(x)) * 256, fy: (y - Math.floor(y)) * 256,
    mpp: 156543.03 * Math.cos(r) / n};
}
function wifiQ(rssi) {                 // [arcs 0-3, quality %, tone] for an RSSI in dBm
  if (rssi === null || rssi === undefined) return null;
  return [rssi >= -60 ? 3 : rssi >= -67 ? 2 : rssi >= -80 ? 1 : 0, Math.max(0, Math.min(100, Math.round(2 * (rssi + 100)))),
    rssi >= -67 ? "" : rssi >= -80 ? "warn" : "bad"];
}
var ARCS = ["M8.5 12.5A5 5 0 0 1 15.5 12.5", "M5.6 9.6A9 9 0 0 1 18.4 9.6", "M2.8 6.8A13 13 0 0 1 21.2 6.8"];
function wifiIcon(n) {                  // a dot and three arcs, n lit
  var h = '<svg class="wi" viewBox="0 0 24 18"><circle cx="12" cy="15.5" r="2"/>';
  for (var i = 0; i < 3; i++) h += '<path' + (i < n ? ' class="on"' : "") + ' d="' + ARCS[i] + '"/>';
  return h + "</svg>";
}
function cell(label, value, unit, tone) {
  return '<div class="' + (tone || "") + '"><small>' + label + "</small><b>" + value + (unit ? "<em>" + unit + "</em>" : "") +
    "</b></div>";
}
function line(label, value, tone) {
  return '<div class="sys">' + label + '<span class="' + (tone || "") + '">' + value + "</span></div>";
}
function meter(frac, tone, mark) {
  return '<div class="bar ' + (tone || "") + '"><i style="width:' + Math.max(0, Math.min(100, Math.round(frac * 100))) + '%"></i>' +
    (mark === undefined ? "" : '<b style="left:' + Math.round(mark * 100) + '%"></b>') + "</div>";
}

// Event log: the diag tail, newest on top. Status lines (one a minute) are
// a row of numbers, everything else an event.
var STATUS = /^up (\d+) utc (\S+) nmea (\d+)\/(\d+) gpsboots (\d+) loops (\d+) sats (\S+) fix (\S+) hdop (\S+) points (\d+) sent (\d+) wifi (\S+) pulses (\d+) mem (\d+) idf (\S+)\/(\S+)/;
function clock(utc, up) {
  var m = /^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/.exec(utc);
  if (!m) return "+" + Math.floor(up / 60) + "m";
  var t = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
  return two(t.getHours()) + ":" + two(t.getMinutes());
}
function logLine(l) {
  var m = STATUS.exec(l), t = "--:--", kind = "", text, ha;
  if (m) {
    var fix = m[8].replace(/_/g, " "), sv = m[7].split("/"), big = nn(m[16]);
    t = clock(m[2], +m[1]);
    kind = fixTone(fix) === "ok" ? "ok" : "warn";
    text = esc(fix.toUpperCase()) + " &middot; " + esc(nn(sv[1])) + "/" + esc(nn(sv[0])) + " SATS" +
      (+m[10] ? " &middot; " + num(m[10]) + " PTS" : "") +
      ((ha = / hacc ([\d.]+)/.exec(l)) ? " &middot; &plusmn;" + esc(ha[1]) + " M" : "") + " &middot; " +
      (big !== null && +big < TLS_KB ? '<span class="err">IDF ' + esc(big) + " KB</span>" : "IDF " + esc(big) + " KB");
    return '<div><span class="t">' + t + '</span>  <span class="' + kind + '">' + text + "</span></div>";
  }
  var b = /^boot cause (\S+) prev_up (\S+)/.exec(l);
  if (b) {
    kind = "boot";
    text = "BOOT &middot; " + esc((BOOT[b[1]] || "cause " + (nn(b[1]) || "-")).toUpperCase()) +
      (b[2] === "-" ? "" : " &middot; PREVIOUS RUN " + esc(hms(+b[2]).toUpperCase()));
  } else if (/^gps /.test(l) && !/^gps reset loop/.test(l)) {
    kind = "info";
    text = "RECEIVER &middot; " + esc(l.slice(4).toUpperCase());
  } else {
    kind = /^(crash|reboot|upload (err|aborted|low idf|ca err))/.test(l) ? "err" : /^gps reset loop/.test(l) ? "warn" : "";
    text = esc(l.toUpperCase());
  }
  return '<div><span class="t">' + t + '</span>  <span class="' + kind + '">' + text + "</span></div>";
}

// status.json -> the HTML of every box (pure: tests/web_page_test.js runs it)
function view(d) {
  var v = {}, svs = d.satellites || [], used = 0, fix = d.fix || "-", dot = " &middot; ";
  var sats = String(d.sats || "- / -").replace(/None/g, "-").split(" / ");   // "seen / used"
  var nm = String(d.nmea || "0 / 0").split(" / "), ok = +nm[0], bad = +nm[1];
  var pct = ok + bad ? bad * 100 / (ok + bad) : 0;
  var ws = String(d.wifi || "").split(" "), ssid = ws.slice(1).join(" ");
  var q = String(d.idf || "").split(" / "), fr = +q[0], big = +q[1];
  var pk = typeof d.mem === "number" ? Math.round(d.mem / 1024) : null;
  var hd = typeof d.hdop === "number" ? d.hdop : null, q4 = wifiQ(d.rssi);
  var ha = typeof d.hacc === "number" ? d.hacc : null;          // NAV-PVT: metres
  var acc = ha !== null ? ha : hd !== null ? hd * UERE : null;  // (else from HDOP)
  var src = d.fix_src === "pvt" ? "NAV-PVT" : d.fix_src === "nmea" ? "NMEA" : "-";
  var ub = String(d.ubx || "- / -").split(" / ");                 // UBX frames ok / bad
  var ubp = +ub[0] + +ub[1] ? +ub[1] * 100 / (+ub[0] + +ub[1]) : 0;   // NAV-PVT path
  v.up = "UP " + esc(hms(d.uptime).toUpperCase());
  v.tm = cell("FIX", esc(fix.replace(" fix", "")).toUpperCase(), "", fixTone(fix)) +
    cell("SATS", esc(sats[1]), "/" + esc(sats[0])) +
    (ha !== null ? cell("ACC", "&plusmn;" + ha.toFixed(1), "m", ha > MAX_HACC ? "warn" : "") :
      cell("HDOP", hd === null ? "-" : hd.toFixed(2), "", hd !== null && hd > 5 ? "warn" : "")) +
    cell("UPLINK", num(d.left), "pts", d.bad_files > 0 ? "bad" : d.upload_err > 0 ? "warn" : "") +
    (q4 ? cell("WIFI", wifiIcon(q4[0]) + q4[1] + '<em>%</em><em class="db">' + d.rssi + " dBm</em>", "", q4[2]) :
      cell("WIFI", esc(ws[0]).toUpperCase())) +
    (d.fix_src === "pvt" ? cell("UBX BAD", ubp.toFixed(2), "%", ubp > 1 ? "warn" : "") :
      cell("NMEA BAD", pct.toFixed(2), "%", pct > 1 ? "warn" : ""));
  var dots = "", bars = "", tbl = "<tr><td>SAT</td><td>dBHz</td><td>ELEV</td><td>AZIM</td><td>USED</td></tr>";
  for (var i = 0; i < svs.length; i++) {
    var s = svs[i], up = s.elev !== null && s.elev >= 0;
    if (s.used) used++;
    if (up) {
      var r = 90 - s.elev, a = s.azim * Math.PI / 180;
      dots += '<circle class="' + cls(s) + '" cx="' + Math.round(r * Math.sin(a)) + '" cy="' + Math.round(-r * Math.cos(a)) +
        '" r="' + (2.4 + Math.floor((s.cno || 0) / 14)) + '"><title>' + tip(s) + "</title></circle>";
    }
    bars += '<i class="' + cls(s) + '" style="height:' + Math.min(Math.floor((s.cno || 0) * 100 / 45), 100) +
      '%" title="' + tip(s) + '"></i>';
    tbl += '<tr class="' + (s.used ? "" : "u") + '"><td>' + esc(s.name) + (s.unhealthy ? " !" : "") + "</td><td>" +
      (s.cno || "-") + "</td><td>" + (up ? s.elev + "&deg;" : "-") + "</td><td>" + (up ? s.azim + "&deg;" : "-") +
      "</td><td>" + (s.used ? "&#9679;" : "") + "</td></tr>";
  }
  v.dots = dots;
  v.bars = bars || '<span class="sys">NO SATELLITE LIST YET</span>';
  v.skyh = "Sky &middot; " + used + " locked / " + svs.length + " tracked";
  v.bh = "Signal &middot; dBHz" + (d.satellites_age_s === null || d.satellites_age_s === undefined ? "" :
    " &middot; list " + hms(d.satellites_age_s) + " old");
  v.svh = "Satellite table &middot; " + svs.length;
  v.svt = tbl;
  var rx = String(d.receiver || "unknown receiver"), comma = rx.indexOf(", ");
  var fk = d.flash_kb, pr = d.prev_run ? String(d.prev_run) : "";
  v.sys = line("IDF BLOCK", isNaN(big) ? "-" : big + " KB<em>of " + fr + " free</em>", big < TLS_KB ? "bad" : "") +
    (isNaN(big) ? "" : meter(big / 160, big < TLS_KB ? "bad" : "", TLS_KB / 160)) +
    line("PY HEAP FREE", esc(pk) + " / " + esc(d.heap_kb) + " KB", pk !== null && pk < 8 ? "warn" : "") +
    (d.heap_kb && pk !== null ? meter(pk / d.heap_kb) : "") +
    line("FLASH FREE", fk === null || fk === undefined ? "-" : (fk / 1024).toFixed(1) + " MB<em>&asymp;" +
      num(Math.floor(fk * 1024 / POINT_B / 1000)) + "k pts</em>") +
    line("UPLINK", esc(d.upload).toUpperCase() + "<em>" + num(d.sent) + " sent" + dot + num(d.files) + " files" + dot +
      num(d.upload_err) + " err" + dot + num(d.bad_files) + " bad</em>",
      d.bad_files > 0 ? "bad" : d.upload_err > 0 || /err|low/.test(d.upload || "") ? "warn" : "") +
    line("TRACK", num(d.points) + " pts logged" + (d.stay === "yes" ? "<em>staying</em>" : "")) +
    line("RECEIVER", esc(comma > 0 ? rx.slice(0, comma) : rx).toUpperCase() + "<em>" + num(d.gps_boots) + " rst" + dot +
      num(d.gps_loops) + " loops" + dot + "setup " + (d.setup_ok === true ? "ok" : d.setup_ok === false ? "no" : "-") +
      "</em>", d.gps_loops > 0 || d.setup_ok === false ? "warn" : "") +
    line("FIX SOURCE", src + "<em>ubx " + esc(ub[0]) + " ok" + dot + esc(ub[1]) + " bad</em>") +
    line("WIFI", esc(ssid || nn(ws[0])) + (q4 ? " &middot; " + q4[1] + "% (" + d.rssi + " dBm)" : "") + "<em>" + num(d.pulses) +
      " keep-alive</em>", q4 ? q4[2] : "") +
    line("BOOT", esc(BOOT[d.boot_cause] || d.boot_cause).toUpperCase() + (pr ? "<em>prev " + esc(pr) + "</em>" : ""),
      d.boot_cause === 3 || /crash/.test(pr) ? "warn" : "") +
    line("CHIP", (d.temp === null || d.temp === undefined ? "-" : d.temp) + " &deg;C" + dot + esc(d.mhz) + " MHz" +
      (d.utc ? "<em>" + esc(String(d.utc).slice(11, 19)) + " UTC</em>" : ""));
  var lines = d.diag || [], log = "";
  for (var j = lines.length - 1; j >= 0; j--) log += logLine(lines[j]);
  v.log = log || '<span class="t">THE DIAGNOSTIC LOG IS EMPTY</span>';
  var p = String(d.position || "").split(", ");
  v.coord = p.length === 2 && !isNaN(+p[0]) && !isNaN(+p[1]) ?
    Math.abs(+p[0]).toFixed(5) + "&deg; " + (+p[0] < 0 ? "S" : "N") + "  " +
    Math.abs(+p[1]).toFixed(5) + "&deg; " + (+p[1] < 0 ? "W" : "E") +
    (acc === null ? "" : dot + "&plusmn;" + acc.toFixed(1) + " m") :
    "NO FIX &middot; " + esc(fix).toUpperCase();
  return v;
}

// The day's track since local midnight from the board's day history
// (/hist?d=<UTC day>&o=<byte>): HIST_REPLY bytes a reply at most, then only
// what is new, once a minute. Lines as in a .trk: lat,lon first, the time
// (YYYYMMDDTHHMMSSZ) last; a gap over 5 min breaks the line.
var HIST_REPLY = 16384, hist = {start: -1, days: [], off: {}, rest: {}, pts: [], km: 0, busy: false, at: 0};
function utcDay(ms) { return new Date(ms).toISOString().slice(0, 10).replace(/-/g, ""); }
function histParse(day, text) {
  var ls = ((hist.rest[day] || "") + text).split("\n");
  hist.rest[day] = ls.pop();
  for (var i = 0; i < ls.length; i++) {
    var f = ls[i].split(","), s = f[f.length - 1];
    if (f.length < 5 || s.length !== 16 || f[0] === "") continue;
    var t = Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(9, 11), +s.slice(11, 13), +s.slice(13, 15));
    var la = +f[0], lo = +f[1], q = hist.pts[hist.pts.length - 1];
    if (t < hist.start || isNaN(t) || isNaN(la) || isNaN(lo)) continue;
    if (q && t - q[0] <= 300000) {
      var c = Math.cos(la * Math.PI / 180);
      hist.km += Math.sqrt(Math.pow((la - q[1]) * 110.54, 2) + Math.pow((lo - q[2]) * 111.32 * c, 2));
    }
    hist.pts.push([t, la, lo]);
  }
}
function histLoad() {
  var now = Date.now(), m = new Date(now);
  m.setHours(0, 0, 0, 0);
  if (m.getTime() !== hist.start) {     // a new local day: start over
    hist = {start: m.getTime(), days: [utcDay(m.getTime())], off: {}, rest: {}, pts: [], km: 0, busy: false, at: 0};
  }
  if (hist.days.indexOf(utcDay(now)) < 0) hist.days.push(utcDay(now));
  hist.busy = true;
  histNext(0);
}
function histNext(i) {
  if (i >= hist.days.length) {
    hist.busy = false;
    hist.at = Date.now();
    if (mapD) placeMap(mapD);
    return;
  }
  var day = hist.days[i], o = hist.off[day] || 0, x = new XMLHttpRequest();
  x.open("GET", "/hist?d=" + day + "&o=" + o, true);
  x.timeout = 10000;
  x.onload = function () {
    var t = x.status === 200 ? x.responseText : "";
    if (t) { hist.off[day] = o + t.length; histParse(day, t); }
    histNext(t.length >= HIST_REPLY ? i : i + 1);
  };
  x.onerror = x.ontimeout = function () { hist.busy = false; hist.at = Date.now(); };
  x.send();
}
// world pixels (256 a tile at zoom 0) of a position at zoom z
function wpx(lat, lon, z) {
  var k = 256 * Math.pow(2, z), r = lat * Math.PI / 180;
  return [(lon + 180) / 360 * k, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * k];
}
// The view: the position and the day's track fitted between the header
// and the telemetry strip, centred on them. A fractional zoom (ZOOM at
// most, 13 at least): the tiles of the zoom above, scaled down (sc <= 1,
// crisp). -> the tile zoom, the scale and the world pixel at the map's
// anchor (50%, 42%)
function fitView(lat, lon, el) {
  var w = el.offsetWidth, h = el.offsetHeight, top = 44, bot = h - 90, zf = ZOOM;
  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, ps = hist.pts.concat([[0, lat, lon]]);
  for (var i = 0; i < ps.length; i++) {
    var q = wpx(ps[i][1], ps[i][2], 0);
    x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
  }
  if (x1 > x0) zf = Math.min(zf, Math.log((w - 48) / (x1 - x0)) / Math.LN2);
  if (y1 > y0) zf = Math.min(zf, Math.log((bot - top - 32) / (y1 - y0)) / Math.LN2);
  zf = Math.max(13, zf);
  var z = Math.ceil(zf - 1e-9), k = Math.pow(2, z), sc = Math.pow(2, zf - z);
  if (hist.pts.length < 2) { var c = wpx(lat, lon, z); return {z: z, sc: sc, X: c[0], Y: c[1]}; }
  return {z: z, sc: sc, X: (x0 + x1) / 2 * k, Y: (y0 + y1) / 2 * k + (h * .42 - (top + bot) / 2) / sc};
}
function histPath(t, z) {               // SVG path in the tile layer's pixels
  var k = Math.pow(2, z), d = "", prev = 0;
  for (var i = 0; i < hist.pts.length; i++) {
    var p = hist.pts[i], r = p[1] * Math.PI / 180;
    var x = ((p[2] + 180) / 360 * k - t.x) * 256, y = ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * k - t.y) * 256;
    d += (i && p[0] - prev <= 300000 ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    prev = p[0];
  }
  return d;
}

// The map: tiles around the position, rebuilt only when the centre tile
// changes; the fraction moves the layer (no reload every poll)
var mapKey = "", trkKey = "", mapD = null;
function placeMap(d) {
  mapD = d;
  var el = document.getElementById("map"), p = String(d.position || "").split(", ");
  if (p.length !== 2 || isNaN(+p[0]) || isNaN(+p[1])) { el.className = "map nofix"; return; }
  el.className = "map";
  // tiles to cover the element from its centre (a wide screen needs more)
  var v = fitView(+p[0], +p[1], el), z = v.z, sc = v.sc, me = wpx(+p[0], +p[1], z);
  var nx = Math.ceil(el.offsetWidth / 512 / sc) + 1, ny = Math.ceil(el.offsetHeight / 512 / sc) + 1;
  var t = {x: Math.floor(v.X / 256), y: Math.floor(v.Y / 256), fx: v.X % 256, fy: v.Y % 256,
    mpp: tile(+p[0], +p[1], z).mpp / sc};
  var key = z + "/" + t.x + "/" + t.y + "/" + nx + "/" + ny, box = document.getElementById("tiles");
  // the pin, its ring and the coordinates at the position (off the anchor
  // when the view is centred on the day's track)
  var ids = ["acc", "pin", "coord"];
  for (var j = 0; j < 3; j++) {
    var s = document.getElementById(ids[j]).style;
    s.left = "calc(50% + " + ((me[0] - v.X) * sc).toFixed(1) + "px)";
    s.top = "calc(42% + " + ((me[1] - v.Y) * sc).toFixed(1) + "px)";
  }
  if (key !== mapKey) {
    var h = "";
    for (var dx = -nx; dx <= nx; dx++) for (var dy = -ny; dy <= ny; dy++)
      h += '<img alt="" src="https://tile.openstreetmap.org/' + z + "/" + (t.x + dx) + "/" + (t.y + dy) +
        '.png" style="left:' + dx * 256 + "px;top:" + dy * 256 + 'px">';
    box.innerHTML = h;
    mapKey = key;
  }
  box.style.transform = (sc < 1 ? "scale(" + sc.toFixed(4) + ") " : "") +
    "translate(" + (-t.fx).toFixed(1) + "px," + (-t.fy).toFixed(1) + "px)";
  var trk = document.getElementById("trk");
  trk.style.transform = box.style.transform;
  if (key + "/" + hist.pts.length !== trkKey) {
    trkKey = key + "/" + hist.pts.length;
    trk.innerHTML = hist.pts.length ? '<svg width="1" height="1"><path d="' + histPath(t, z) + '"/></svg>' : "";
    document.getElementById("day").innerHTML = hist.pts.length ? "<em>TODAY </em>" + hist.km.toFixed(2) + " KM" : "";
  }
  // the ring's radius: NAV-PVT's hAcc as it is, else HDOP * UERE
  var acc = document.getElementById("acc"), px = typeof d.hacc === "number" ? d.hacc * 2 / t.mpp :
    typeof d.hdop === "number" ? d.hdop * UERE * 2 / t.mpp : 0;
  acc.style.width = acc.style.height = Math.max(36, Math.round(px)) + "px";
}

var last = 0, every = 15;
function paint(v) {
  for (var id in v) {
    var e = document.getElementById(id);
    if (e && e.innerHTML !== v[id]) e.innerHTML = v[id];
  }
}
function stale() {
  document.body.className = "off";
  document.getElementById("live").innerHTML = last ? "OFFLINE &middot; " + esc(hms((Date.now() - last) / 1000).toUpperCase()) +
    " AGO" : "NO ANSWER";
}
function tick() {
  var x = new XMLHttpRequest();
  x.open("GET", "/status.json", true);
  x.timeout = 10000;
  x.onload = function () {
    try {
      var d = JSON.parse(x.responseText);
      every = d.refresh_s || 15;
      last = Date.now();
      document.body.className = "";
      document.getElementById("live").innerHTML = "LIVE";
      paint(view(d));
      placeMap(d);
      if (!hist.busy && Date.now() - hist.at >= 60000) histLoad();
    } catch (e) { stale(); }
    setTimeout(tick, every * 1000);
  };
  x.onerror = x.ontimeout = function () { stale(); setTimeout(tick, every * 1000); };
  x.send();
}
if (typeof document !== "undefined") {
  window.onresize = function () { if (mapD) placeMap(mapD); };
  tick();
}
</script>
</body>
</html>
