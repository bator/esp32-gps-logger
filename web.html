<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS logger</title>
<!-- Status page of gps_logger.py, served from the board's flash as is.
     It loads once, then polls /status.json (every refresh_s from the JSON)
     and redraws the boxes; open sections stay open. -->
<style>
:root{--b:#f3f4f6;--c:#fff;--t:#1f2328;--m:#5f6670;--l:#e1e4e8}
@media(prefers-color-scheme:dark){:root{--b:#111317;--c:#1b1e23;--t:#e6e8eb;--m:#9aa1aa;--l:#30353c}}
body{font:15px system-ui,sans-serif;margin:0 auto;padding:16px;max-width:900px;background:var(--b);color:var(--t)}
h1{font-size:20px;margin:0}
.m,small,summary,td:first-child,text{color:var(--m);fill:var(--m)}
.w{display:grid;gap:12px;margin:12px 0;transition:opacity .3s}
.off .w{opacity:.45}
.k{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c,.k div,details{background:var(--c);border-radius:12px;padding:12px 14px}
b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
@media(min-width:720px){.w{grid-template-columns:1fr 1fr}.s{grid-area:1/1/3/2}}
svg{display:block;max-width:400px;margin:auto}
.a{fill:none;stroke:var(--l)}
text{font-size:9px;text-anchor:middle}
[class^=g]{--s:#9ca3af}.g0{--s:#3b82f6}.g2{--s:#14b8a6}.g3{--s:#f59e0b}.g6{--s:#ec4899}
circle[class]{fill:var(--s);stroke:var(--s);stroke-width:1.5}
circle.u{fill:none}
.b{display:flex;flex-direction:column}
.r{flex:1;display:flex;align-items:flex-end;gap:2px;min-height:80px;margin-top:8px}
.r i{flex:1;min-height:2px;background:var(--s);border-radius:2px 2px 0 0;box-sizing:border-box}
.r .u{background:none;border:1.5px solid var(--s)}
.l span{white-space:nowrap;margin-right:10px}
.l i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:4px;background:var(--s)}
.l .u{background:none;border:1.5px solid var(--m);box-sizing:border-box}
.d0:before,.d1:before,.d2:before{content:"\25cf";margin-right:6px;color:#dc2626}
.d1:before{color:#d97706}.d2:before{color:#16a34a}
details{margin-top:8px}
summary{cursor:pointer}
table{border-collapse:collapse;width:100%;margin-top:8px}
td,th{padding:5px 4px;border-top:1px solid var(--l);text-align:left}
td+td{text-align:right;font-variant-numeric:tabular-nums}
pre{font-size:12px;overflow-x:auto}
</style>
</head>
<body>
<h1 id="dev">GPS logger</h1>
<div class="m" id="sub">connecting&hellip;</div>
<div class="w">
  <div class="k">
    <div><b id="k0">-</b><small id="s0">fix</small></div>
    <div><b id="k1">-</b><small id="s1">satellites used / seen</small></div>
    <div><b id="k2">-</b><small id="s2">to upload</small></div>
    <div><b id="k3">-</b><small id="s3">WiFi</small></div>
  </div>
  <div class="c s">
    <svg viewBox="-100 -100 200 200">
      <g class="a"><circle r="90"/><circle r="60"/><circle r="30"/><path d="M0-90V90M-90 0H90"/></g>
      <text y="-92">N</text><text x="95" y="3">E</text><text y="99">S</text><text x="-95" y="3">W</text>
      <g id="dots"></g>
    </svg>
    <small class="l"><span><i class="g0"></i>GPS</span><span><i class="g2"></i>Galileo</span><span><i class="g3"></i>BeiDou</span><span><i class="g6"></i>GLONASS</span><span><i class="g1"></i>other</span><span><i class="g1 u"></i>not used</span></small>
  </div>
  <div class="c b"><small id="bh">Signal per satellite (dBHz, full bar 45)</small><div class="r" id="bars"></div></div>
</div>
<details><summary>Details</summary><table id="rows"></table></details>
<details><summary id="sh">Satellites</summary><table id="svt"></table></details>
<details><summary>Diagnostic log</summary><pre id="log"></pre></details>
<script>
// Row labels by status.json key (the board sends only keys and values)
var LABELS = [
  ["GPS", [["fix", "Fix"], ["sats", "Satellites seen / used"], ["hdop", "HDOP"],
    ["utc", "GPS time (UTC)"], ["position", "Position"], ["nmea", "NMEA ok / bad"],
    ["gps_boots", "Receiver restarts"], ["gps_loops", "Reset-loop warnings"],
    ["receiver", "Receiver"], ["setup_ok", "Setup acknowledged"]]],
  ["Points", [["points", "Logged since boot"], ["left", "Waiting for upload"],
    ["files", "Track files waiting"], ["bad_files", "Quarantined files (.bad)"],
    ["sent", "Uploaded since boot"], ["upload", "Upload state"],
    ["upload_err", "Upload errors"], ["stay", "Stay"]]],
  ["Device", [["uptime", "Uptime"], ["prev_run", "Previous run"],
    ["boot_cause", "Boot cause"], ["temp", "Chip temperature (C)"], ["mhz", "CPU (MHz)"],
    ["mem", "Free Python heap (B)"], ["idf", "IDF heap free / largest block (KB)"],
    ["flash_kb", "Free flash (KB)"], ["wifi", "WiFi"], ["rssi", "RSSI (dBm)"],
    ["pulses", "Keep-alive pulses"]]]
];
var GNSS = {GPS: 0, SBAS: 1, Galileo: 2, BeiDou: 3, QZSS: 5, GLONASS: 6};

function esc(v) {
  if (v === null || v === undefined) return "-";
  if (v === true) return "yes";
  if (v === false) return "no";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function two(n) { return (n < 10 ? "0" : "") + n; }
function hms(s) {                       // as _hms() in gps_logger.py
  if (s === null || s === undefined) return "-";
  s = Math.floor(s);
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min " + two(s % 60) + " s";
  if (s < 86400) return Math.floor(s / 3600) + " h " + two(Math.floor(s / 60) % 60) + " min";
  return Math.floor(s / 86400) + " d " + two(Math.floor(s / 3600) % 24) + " h";
}
function cls(sv) { return "g" + (GNSS[sv.system] === undefined ? 1 : GNSS[sv.system]) + (sv.used ? "" : " u"); }
function tip(sv) { return esc(sv.name) + " " + (sv.cno || "-") + " dBHz"; }

// status.json -> the HTML of every box (pure: tests/web_page_test.js runs it)
function view(d) {
  var v = {}, svs = d.satellites || [], used = 0, fix = d.fix || "-";
  var hd = typeof d.hdop === "number" ? d.hdop.toFixed(2) : "-";
  v.dev = esc(d.device);
  v.sub = "up " + hms(d.uptime) + (d.position ? " &middot; " + esc(d.position) : "");
  v.k0 = '<span class="d' + (fix.indexOf("3D") === 0 ? 2 : fix.indexOf("fix") >= 0 ? 1 : 0) +
    '">' + esc(fix) + "</span>";
  v.s0 = "HDOP " + hd;
  var sats = String(d.sats || "- / -").split(" / ");   // "seen / used"
  v.k1 = esc(sats[1]) + " / " + esc(sats[0]);
  v.k2 = esc(d.left);
  v.s2 = "to upload, " + esc(d.upload);
  var ws = String(d.wifi || "").split(" ");
  v.k3 = d.rssi === null || d.rssi === undefined ? esc(ws[0]) : d.rssi + " dBm";
  v.s3 = ws.slice(1).join(" ") ? esc(ws.slice(1).join(" ")) : "WiFi";
  var dots = "", bars = "", tbl = "<tr><th>Satellite</th><th>dBHz</th><th>Elev</th><th>Azim</th><th>Used</th></tr>";
  for (var i = 0; i < svs.length; i++) {
    var s = svs[i], up = s.elev !== null && s.elev >= 0;
    if (s.used) used++;
    if (up) {
      var r = 90 - s.elev, a = s.azim * Math.PI / 180;
      dots += '<circle class="' + cls(s) + '" cx="' + Math.round(r * Math.sin(a)) +
        '" cy="' + Math.round(-r * Math.cos(a)) + '" r="' + (3 + Math.floor((s.cno || 0) / 12)) +
        '"><title>' + tip(s) + "</title></circle>";
    }
    bars += '<i class="' + cls(s) + '" style="height:' + Math.min(Math.floor((s.cno || 0) * 100 / 45), 100) +
      '%" title="' + tip(s) + '"></i>';
    tbl += "<tr><td>" + esc(s.name) + (s.unhealthy ? " (unhealthy)" : "") + "</td><td>" + (s.cno || "-") +
      "</td><td>" + (up ? s.elev + "&deg;" : "-") + "</td><td>" + (up ? s.azim + "&deg;" : "-") +
      "</td><td>" + (s.used ? "yes" : "") + "</td></tr>";
  }
  v.dots = dots;
  v.bars = bars || "<small>No satellite list from the receiver yet.</small>";
  v.bh = "Signal per satellite (dBHz, full bar 45)" +
    (d.satellites_age_s === null || d.satellites_age_s === undefined ? "" : ", list " + hms(d.satellites_age_s) + " old");
  v.sh = "Satellites (" + used + " used of " + svs.length + ")";
  v.svt = tbl;
  var rows = "";
  for (var g = 0; g < LABELS.length; g++) {
    rows += '<tr><th colspan="2">' + LABELS[g][0] + "</th></tr>";
    for (var j = 0; j < LABELS[g][1].length; j++) {
      var key = LABELS[g][1][j][0], val = d[key];
      if (key === "uptime") val = hms(val);
      else if (key === "hdop") val = hd;
      rows += "<tr><td>" + LABELS[g][1][j][1] + "</td><td>" + esc(val) + "</td></tr>";
    }
  }
  v.rows = rows;
  v.log = (d.diag || []).map(esc).join("\n");
  return v;
}

var last = 0, every = 15;
function paint(v) {
  for (var id in v) {
    var e = document.getElementById(id);
    if (e && e.innerHTML !== v[id]) e.innerHTML = v[id];
  }
}
function stale() {
  document.body.className = "off";
  document.getElementById("sub").innerHTML = last ?
    "offline &middot; last update " + hms((Date.now() - last) / 1000) + " ago" : "no answer from the board";
}
function tick() {
  var x = new XMLHttpRequest();
  x.open("GET", "/status.json", true);
  x.timeout = 10000;
  x.onload = function () {
    try {
      var d = JSON.parse(x.responseText);
      every = d.refresh_s || 15;
      last = Date.now();
      document.body.className = "";
      paint(view(d));
    } catch (e) { stale(); }
    setTimeout(tick, every * 1000);
  };
  x.onerror = x.ontimeout = function () { stale(); setTimeout(tick, every * 1000); };
  x.send();
}
if (typeof document !== "undefined") tick();
</script>
</body>
</html>
