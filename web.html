<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS logger</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- Status page of gps_logger.py, served from the board's flash as is.
     It loads once, then polls /status.json (every refresh_s from the JSON)
     and redraws the boxes. -->
<style>
:root{--b:#eceef1;--c:#fff;--t:#1f2328;--m:#5f6670;--l:#e3e6ea;--in:#eef0f3;--ac:#2563eb;--bad:#b91c1c;--warn:#b45309;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--b:#0c0d10;--c:#1c1f25;--t:#e6e8eb;--m:#9aa1aa;--l:#2e333a;--in:#262a31;--ac:#60a5fa;--bad:#f87171;--warn:#fbbf24;--ok:#4ade80}}
body{font:15px Inter,system-ui,sans-serif;margin:0 auto;padding:16px;max-width:900px;background:var(--b);color:var(--t)}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.m,small,text,.h{color:var(--m);fill:var(--m)}
.w{display:grid;gap:12px;margin:12px 0;transition:opacity .3s}
.off .w,.off .t{opacity:.45}
.c{background:var(--c);border-radius:12px;padding:12px 14px}
.lb,.hr small{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--m)}
.ic{display:inline-block;width:15px;height:15px;margin:0 6px 0 0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.k{display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden;grid-column:1/-1}
.k>div{padding:12px 14px;min-width:0}
.k>div:nth-child(2n){border-left:1px solid var(--l)}
.k>div:nth-child(n+3){border-top:1px solid var(--l)}
.k b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k small:last-child{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w{grid-template-columns:1fr 1fr}.l{grid-column:1/-1;margin:-4px 2px 0}
@media(min-width:720px){.s{grid-area:1/1/3/2}.k{grid-column:2}}
svg{display:block;max-width:400px;margin:4px auto 0}
.a{fill:none;stroke:var(--l)}
text{font-size:12px;text-anchor:middle}
[class^=g],[class*=" g"]{--s:#9ca3af}.g0{--s:#3b82f6}.g2{--s:#14b8a6}.g3{--s:#f59e0b}.g6{--s:#ec4899}
circle[class]{fill:var(--s);stroke:var(--s);stroke-width:1.5}
circle.u{fill:none}
.b{display:flex;flex-direction:column}
.r{flex:1;display:flex;align-items:flex-end;gap:2px;min-height:110px;margin-top:10px;background:linear-gradient(var(--l),var(--l)) 0 0/100% 1px no-repeat,linear-gradient(var(--l),var(--l)) 0 33.33%/100% 1px no-repeat,linear-gradient(var(--l),var(--l)) 0 66.67%/100% 1px no-repeat}
.r i{flex:1;min-width:2px;min-height:2px;background:var(--s);border-radius:2px 2px 0 0;box-sizing:border-box}
.r .u{background:none;border:1.5px solid var(--s)}
.l span{white-space:nowrap;margin-right:10px}
.l i,.sg i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:4px;background:var(--s)}
.l .u{background:none;border:1.5px solid var(--m);box-sizing:border-box}
.d0:before,.d1:before,.d2:before{content:"\25cf";margin-right:6px;color:#dc2626}
.d1:before{color:#d97706}.d2:before{color:#16a34a}
/* tabs */
.t{background:var(--c);border-radius:12px;padding:0 16px 8px;transition:opacity .3s}
.tabs{display:flex;border-bottom:1px solid var(--l);margin:0 -16px 4px;padding:0 8px}
.tabs button{flex:1;white-space:nowrap;font:inherit;font-size:14px;color:var(--m);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 4px 10px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--t);font-weight:600;border-bottom-color:var(--ac)}
.p[hidden]{display:none}
.h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 4px}
/* details: one row per subsystem */
.hr{display:grid;grid-template-columns:18px 1fr auto;column-gap:12px;padding:12px 0;border-top:1px solid var(--l);cursor:pointer}
.hr p,.hr .mt{display:none}.hr.o p,.hr.o .mt{display:block}
.hr small:after{content:"";display:inline-block;width:5px;height:5px;margin:0 0 2px 7px;border:solid var(--m);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.hr.o small:after{transform:rotate(-135deg);margin-bottom:-1px}
.hr:first-child{border-top:0}
.hr>.ic{width:18px;height:18px;margin:1px 0 0;color:var(--m)}
.ic.ok{color:#16a34a}.ic.warn{color:#d97706}.ic.bad{color:#dc2626}
.hr strong{display:block;font-size:16px;font-weight:600;margin-top:1px;overflow-wrap:anywhere}
.hr p{margin:2px 0 0;font-size:13px;color:var(--m);font-variant-numeric:tabular-nums}
.hr>b{font-size:20px;font-weight:700;letter-spacing:-.01em;text-align:right;align-self:center}
.hr>b em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--m)}
.bad{color:var(--bad)}.warn{color:var(--warn)}
.mt{position:relative;height:6px;border-radius:3px;background:var(--l);margin-top:8px;max-width:360px}
.mt i{display:block;height:6px;border-radius:3px;background:#16a34a}
.mt.bad i{background:#dc2626}.mt.warn i{background:#d97706}
.mt b{position:absolute;top:-3px;width:2px;height:12px;background:var(--t)}
/* satellites */
.sg{margin:14px 0 4px;font-weight:600}
.sr.hd+.sg{margin-top:6px}
.sg small{font-weight:400;margin-left:6px}
.sr{display:grid;grid-template-columns:3.2em 1fr 2.4em 2.8em 3.2em;align-items:center;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.sr span{text-align:right}.sr span:first-child{text-align:left}
.sr.hd{font-size:12px;color:var(--m)}
.sr.u{color:var(--m)}
.sb{height:8px;border-radius:4px;background:var(--l)}
.sb i{display:block;height:8px;border-radius:4px;background:var(--s);box-sizing:border-box}
.u .sb i{background:none;border:1.5px solid var(--s)}
.uh{font-size:11px;color:var(--warn)}
.ns{margin-top:12px;font-size:13px;color:var(--m);line-height:1.5}
/* log: timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:5px 0 5px 0}
.tl li:before{content:"";position:absolute;left:calc(3.4em + 4px);top:0;bottom:0;width:2px;background:var(--l)}
.tl li:first-child:before{top:50%}.tl li:last-child:before{bottom:50%}
.tl time{font-size:13px;color:var(--m);font-variant-numeric:tabular-nums;text-align:right}
.tl p{margin:0;padding-left:18px;position:relative;font-size:13px;font-variant-numeric:tabular-nums}
.tl p:before{content:"";position:absolute;left:-1px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--l);border:2px solid var(--c)}
.tl .f2 p:before{background:#16a34a}.tl .f1 p:before{background:#d97706}.tl .f0 p:before{background:#dc2626}
.tl .e p{font-weight:600;font-size:14px}
.tl .e p:before{left:-3px;top:4px;width:12px;height:12px;background:var(--m)}
.tl .boot p:before{background:#3b82f6}.tl .err p:before{background:var(--bad)}.tl .gps p:before{background:var(--warn)}
.tl small{display:block;font-weight:400}
.tl .st{color:var(--m)}
</style>
</head>
<body>
<svg style="display:none"><!-- line icons in the style of Lucide (ISC) -->
  <symbol id="i-fix" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-sats" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><path d="M10.4 21.9a10 10 0 0 0 9.94-15.42M13.5 2.1a10 10 0 0 0-9.84 15.42"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 13v8M8 17l4-4 4 4"/><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.24"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0"/></symbol>
  <symbol id="i-sky" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.41a2 2 0 0 1-1.27 1.27L7.76 16.24l1.8-5.41a2 2 0 0 1 1.27-1.27z"/></symbol>
  <symbol id="i-sig" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16M8 17v-3M13 17V9M18 17V5"/></symbol>
  <symbol id="i-dish" viewBox="0 0 24 24"><path d="M4 10a7.31 7.31 0 0 0 10 10Z"/><path d="m9 15 3-3M17 13a6 6 0 0 0-6-6M21 13A10 10 0 0 0 11 3"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><path d="M22 12H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11zM6 16h.01M10 16h.01"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></symbol>
</svg>
<h1 id="dev">GPS logger</h1>
<div class="m" id="sub">connecting&hellip;</div>
<div class="w">
  <div class="c k">
    <div><span class="lb"><svg class="ic"><use href="#i-fix"/></svg>Fix</span><b id="k0">-</b><small id="s0">HDOP -</small></div>
    <div><span class="lb"><svg class="ic"><use href="#i-sats"/></svg>Satellites</span><b id="k1">-</b><small>used / seen</small></div>
    <div><span class="lb"><svg class="ic"><use href="#i-up"/></svg>Upload</span><b id="k2">-</b><small id="s2">waiting</small></div>
    <div><span class="lb"><svg class="ic"><use href="#i-wifi"/></svg>WiFi</span><b id="k3">-</b><small id="s3">-</small></div>
  </div>
  <div class="c s"><span class="lb"><svg class="ic"><use href="#i-sky"/></svg>Sky view</span>
    <svg viewBox="-100 -100 200 200">
      <g class="a"><circle r="90"/><circle r="60"/><circle r="30"/><path d="M0-90V90M-90 0H90"/></g>
      <text y="-92">N</text><text x="95" y="3">E</text><text y="99">S</text><text x="-95" y="3">W</text>
      <g id="dots"></g>
    </svg>
  </div>
  <div class="c b"><div><span class="lb" title="lines at 15, 30 and 45 dBHz"><svg class="ic"><use href="#i-sig"/></svg>Signal</span><small id="bh">dBHz</small></div><div class="r" id="bars"></div></div>
    <small class="l"><span><i class="g0"></i>GPS</span><span><i class="g2"></i>Galileo</span><span><i class="g3"></i>BeiDou</span><span><i class="g6"></i>GLONASS</span><span><i class="g1"></i>other</span><span><i class="g1 u"></i>not used</span></small>
</div>
<div class="t">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-p="pd">Details</button>
    <button role="tab" aria-selected="false" data-p="ps">Satellites</button>
    <button role="tab" aria-selected="false" data-p="pl">Log</button>
  </div>
  <div class="p" id="pd" role="tabpanel"></div>
  <div class="p" id="ps" role="tabpanel" hidden></div>
  <div class="p" id="pl" role="tabpanel" hidden></div>
</div>
<script>
var GNSS = {GPS: 0, SBAS: 1, Galileo: 2, BeiDou: 3, QZSS: 5, GLONASS: 6};
var BOOT = {1: "power on", 2: "hard reset", 3: "watchdog", 4: "deep sleep", 5: "soft reset"};
var TLS_KB = 48;                        // TLS_MIN_KB in gps_logger.py
var POINT_B = 46;                       // bytes per .trk point
// every status.json key the Details tab shows (tests check none is missing)
var SHOWN = ("fix sats hdop utc position nmea gps_boots gps_loops receiver setup_ok points left files " +
  "bad_files sent upload upload_err stay uptime prev_run boot_cause temp mhz mem heap_kb idf flash_kb " +
  "wifi rssi pulses").split(" ");
// keys shown elsewhere or folded into another cell (tests: every key used)
var OTHER = ["device", "refresh_s", "diag", "satellites", "satellites_age_s", "prev_uptime"];

function esc(v) {
  if (v === null || v === undefined) return "-";
  if (v === true) return "yes";
  if (v === false) return "no";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function two(n) { return (n < 10 ? "0" : "") + n; }
function hms(s) {                       // as _hms() in gps_logger.py
  if (s === null || s === undefined) return "-";
  s = Math.floor(s);
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min " + two(s % 60) + " s";
  if (s < 86400) return Math.floor(s / 3600) + " h " + two(Math.floor(s / 60) % 60) + " min";
  return Math.floor(s / 86400) + " d " + two(Math.floor(s / 3600) % 24) + " h";
}
function num(n) {                       // 24362 -> "24 362"
  return n === null || n === undefined ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
function pl(n, word) { return num(n) + " " + word + (n === 1 ? "" : "s"); }
function gid(sv) { return GNSS[sv.system] === undefined ? 1 : GNSS[sv.system]; }
function cls(sv) { return "g" + gid(sv) + (sv.used ? "" : " u"); }
function tip(sv) { return esc(sv.name) + " " + (sv.cno || "-") + " dBHz"; }
function fixCls(fix) { return fix.indexOf("3D") === 0 ? 2 : fix.indexOf("fix") >= 0 ? 1 : 0; }
function meter(frac, tone, mark) {
  return '<div class="mt ' + tone + '"><i style="width:' + Math.max(0, Math.min(100, Math.round(frac * 100))) +
    '%"></i>' + (mark === undefined ? "" : '<b style="left:' + Math.round(mark * 100) + '%"></b>') + "</div>";
}

// Details: one row per subsystem - status dot, headline, one quiet line of
// numbers, a number on the right
var opened = {};                        // Details rows the viewer opened
var ICON = {Receiver: "dish", Position: "pin", Upload: "up", Memory: "gauge", Storage: "disk", WiFi: "wifi",
  Device: "cpu"};
function row(tone, title, main, sub, right, extra) {
  return '<div class="hr' + (opened[title] ? " o" : "") + '" data-r="' + title + '"><svg class="ic ' + tone + '"><use href="#i-' + ICON[title] + '"/></svg><div><small>' + title + "</small><strong>" + main +
    "</strong>" + (sub ? "<p>" + sub + "</p>" : "") + (extra || "") + "</div><b>" + (right || "") + "</b></div>";
}
function details(d) {
  var dot = " &middot; ", h = "", t;
  var nm = String(d.nmea || "0 / 0").split(" / "), ok = +nm[0], bad = +nm[1];
  var pct = ok ? bad * 100 / (ok + bad) : 0;
  t = d.gps_loops > 0 || d.setup_ok === false || pct > 1 ? "warn" : ok ? "ok" : "";
  var rx = String(d.receiver || "unknown receiver"), cut = rx.indexOf(", ");
  h += row(t, "Receiver", esc(cut > 0 ? rx.slice(0, cut) : rx),
    (cut > 0 ? esc(rx.slice(cut + 2)) + "<br>" : "") + pl(ok, "sentence") + dot + num(bad) + " bad" + dot +
    pl(d.gps_boots, "restart") + dot + pl(d.gps_loops, "reset loop") + dot + "setup " +
    (d.setup_ok === true ? "acknowledged" : d.setup_ok === false ? "not acknowledged" : "-"),
    pct.toFixed(1) + "%<em>bad</em>");
  var fix = d.fix || "-", sats = String(d.sats || "- / -").split(" / ");
  h += row(["bad", "warn", "ok"][fixCls(fix)], "Position", d.position ? esc(d.position) : esc(fix),
    esc(fix) + dot + "HDOP " + (typeof d.hdop === "number" ? d.hdop.toFixed(2) : "-") + dot + esc(sats[1]) +
    " of " + esc(sats[0]) + " satellites" + (d.utc ? dot + esc(String(d.utc).slice(11, 19)) + " UTC" : ""),
    esc(sats[1]) + "<em>used</em>");
  t = d.bad_files > 0 ? "bad" : d.upload_err > 0 || /err|low/.test(d.upload || "") ? "warn" : "ok";
  h += row(t, "Upload", esc(d.upload), pl(d.left, "point") + " waiting in " + pl(d.files, "file") + dot +
    num(d.sent) + " sent since boot" + dot + pl(d.upload_err, "error") + dot + num(d.bad_files) +
    " quarantined" + dot + num(d.points) + " logged" + (d.stay === "yes" ? dot + "staying" : ""),
    num(d.left) + "<em>waiting</em>");
  var q = String(d.idf || "").split(" / "), fr = +q[0], big = +q[1], pk = Math.round((d.mem || 0) / 1024);
  t = big < TLS_KB ? "bad" : pk < 8 ? "warn" : isNaN(big) ? "" : "ok";
  h += row(t, "Memory", isNaN(big) ? "-" : big + " KB in one block for TLS" + (big < TLS_KB ? ", below " +
    TLS_KB + " KB" : ""), "IDF heap " + (isNaN(fr) ? "-" : fr) + " KB free" + dot + "Python heap " + pk +
    " KB free of " + esc(d.heap_kb) + " KB", "", isNaN(big) ? "" :
    '<div class="mt ' + (big < TLS_KB ? "bad" : "") + '"><i style="width:' + Math.min(100, Math.round(big / 1.6)) +
    '%"></i><b style="left:' + Math.round(TLS_KB / 1.6) + '%"></b></div>');
  var fk = d.flash_kb;
  h += row(fk === null || fk === undefined ? "" : fk < 1024 ? "warn" : "ok", "Storage",
    fk === null || fk === undefined ? "-" : (fk / 1024).toFixed(1) + " MB free",
    fk === null || fk === undefined ? "" : "room for about " + num(Math.floor(fk * 1024 / POINT_B)) + " points",
    "");
  var ws = String(d.wifi || "").split(" "), ssid = ws.slice(1).join(" ");
  h += row(ws[0] === "connected" ? "ok" : "", "WiFi", ssid ? esc(ssid) : esc(ws[0]),
    esc(ws[0]) + (d.rssi === null || d.rssi === undefined ? "" : dot + d.rssi + " dBm") + dot + pl(d.pulses, "keep-alive pulse"), d.rssi === null || d.rssi === undefined ? "" : d.rssi + "<em>dBm</em>");
  var pr = d.prev_run ? String(d.prev_run) : "";
  h += row(d.boot_cause === 3 || /crash/.test(pr) ? "warn" : "ok", "Device", "up " + hms(d.uptime),
    "boot: " + esc(BOOT[d.boot_cause] || d.boot_cause) + (pr ? dot + "previous run " + esc(pr) : "") + dot +
    (d.temp === null || d.temp === undefined ? "-" : d.temp) + " &deg;C chip" + dot + esc(d.mhz) + " MHz",
    (d.temp === null || d.temp === undefined ? "-" : d.temp) + "&deg;<em>chip</em>");
  return h;
}

function satellites(svs) {
  if (!svs.length) return "<small>No satellite list from the receiver yet.</small>";
  var groups = {}, order = [0, 2, 3, 6, 5, 1], h = "", quiet = {}, ql = [];
  for (var i = 0; i < svs.length; i++) {
    var g = gid(svs[i]);
    (groups[g] = groups[g] || []).push(svs[i]);
  }
  var all = svs.filter(function (s) { return s.used; }).length;
  h += '<div class="h">' + all + " used of " + svs.length + " listed</div>";
  h += '<div class="sr hd"><span>#</span><span style="text-align:left">signal</span><span>dBHz</span>' +
    "<span>elev</span><span>azim</span></div>";
  for (var o = 0; o < order.length; o++) {
    var list = groups[order[o]];
    if (!list) continue;
    var used = list.filter(function (s) { return s.used; }).length;
    var name = order[o] === 1 ? "SBAS / other" : list[0].system;
    var rows = "";
    for (var j = 0; j < list.length; j++) {
      var s = list[j], up = s.elev !== null && s.elev >= 0;
      if (!s.cno) {
        (quiet[name] = quiet[name] || []).push(s.svid + (s.unhealthy ? "!" : ""));
        continue;
      }
      rows += '<div class="sr ' + cls(s) + '" title="' + tip(s) + '"><span>' + s.svid +
        (s.unhealthy ? ' <span class="uh" title="unhealthy">!</span>' : "") +
        '</span><div class="sb"><i style="width:' + Math.min(Math.floor((s.cno || 0) * 100 / 45), 100) +
        '%"></i></div><span>' + (s.cno || "-") + "</span><span>" + (up ? s.elev + "&deg;" : "-") +
        "</span><span>" + (up ? s.azim + "&deg;" : "-") + "</span></div>";
    }
    if (rows) h += '<div class="sg g' + order[o] + '"><i></i>' + esc(name) + "<small>" + used + " used of " +
      list.length + "</small></div>" + rows;
  }
  for (var k in quiet) ql.push("<b>" + esc(k) + "</b> " + quiet[k].join(" "));
  return h + (ql.length ? '<div class="ns">No signal: ' + ql.join(" &middot; ") + "</div>" : "");
}

// Log tab: the diag tail as a timeline, newest on top. Status lines (one a
// minute) become a quiet row of numbers, everything else is an event.
var STATUS = /^up (\d+) utc (\S+) nmea (\d+)\/(\d+) gpsboots (\d+) loops (\d+) sats (\S+) fix (\S+) hdop (\S+) points (\d+) sent (\d+) wifi (\S+) pulses (\d+) mem (\d+) idf (\S+)\/(\S+)/;
function clock(utc, up) {
  var m = /^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/.exec(utc);
  if (!m) return "+" + Math.floor(up / 60) + "m";
  var t = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
  return two(t.getHours()) + ":" + two(t.getMinutes());
}
function logLine(line) {
  var m = STATUS.exec(line);
  if (m) {
    var fix = m[8].replace(/_/g, " "), big = +m[16], sv = m[7].split("/");
    return '<li class="st f' + fixCls(fix) + '"><time>' + clock(m[2], +m[1]) + "</time><p>" + esc(fix) +
      " &middot; " + esc(sv[1]) + "/" + esc(sv[0]) + " sats" + (+m[10] ? " &middot; " + num(m[10]) + " pts" : "") +
      ' &middot; <span class="' + (big < TLS_KB ? "bad" : "") + '">IDF&nbsp;' + esc(m[16]) + "&nbsp;KB</span></p></li>";
  }
  var kind = "", title = esc(line), sub = "";
  var b = /^boot cause (\S+) prev_up (\S+)/.exec(line);
  if (b) {
    kind = "boot";
    title = "Boot &middot; " + esc(BOOT[b[1]] || "cause " + b[1]);
    sub = b[2] === "-" ? "" : "previous run " + hms(+b[2]);
  } else if (/^(crash|reboot|upload (err|aborted|low idf))/.test(line)) {
    kind = "err";
  } else if (/^gps reset loop/.test(line)) {
    kind = "gps";
  } else if (/^gps /.test(line)) {
    title = "Receiver &middot; " + esc(line.slice(4));
  } else if (/^stay left/.test(line)) {
    title = "Left the stay (WiFi)";
    sub = esc(line.slice(10));
  }
  return '<li class="e ' + kind + '"><time></time><p>' + title + (sub ? "<small>" + sub + "</small>" : "") +
    "</p></li>";
}
function logView(lines) {
  if (!lines.length) return "<small>The diagnostic log is empty.</small>";
  var h = "";
  for (var i = lines.length - 1; i >= 0; i--) h += logLine(lines[i]);
  return '<ol class="tl">' + h + "</ol>";
}

// status.json -> the HTML of every box (pure: tests/web_page_test.js runs it)
function view(d) {
  var v = {}, svs = d.satellites || [], used = 0, fix = d.fix || "-";
  v.dev = esc(d.device);
  v.sub = "up " + hms(d.uptime) + (d.position ? " &middot; " + esc(d.position) : "");
  v.k0 = '<span class="d' + fixCls(fix) + '">' + esc(fix) + "</span>";
  v.s0 = "HDOP " + (typeof d.hdop === "number" ? d.hdop.toFixed(2) : "-");
  var sats = String(d.sats || "- / -").replace("None", "-").split(" / ");   // "seen / used"
  v.k1 = esc(sats[1]) + " / " + esc(sats[0]);
  v.k2 = esc(d.left);
  v.s2 = "waiting &middot; " + esc(d.upload);
  var ws = String(d.wifi || "").split(" ");
  v.k3 = d.rssi === null || d.rssi === undefined ? esc(ws[0]) : d.rssi + " dBm";
  v.s3 = ws.slice(1).join(" ") ? esc(ws.slice(1).join(" ")) : "no network";
  var dots = "", bars = "";
  for (var i = 0; i < svs.length; i++) {
    var s = svs[i];
    if (s.used) used++;
    if (s.elev !== null && s.elev >= 0) {
      var r = 90 - s.elev, a = s.azim * Math.PI / 180;
      dots += '<circle class="' + cls(s) + '" cx="' + Math.round(r * Math.sin(a)) +
        '" cy="' + Math.round(-r * Math.cos(a)) + '" r="' + (3 + Math.floor((s.cno || 0) / 12)) +
        '"><title>' + tip(s) + "</title></circle>";
    }
    bars += '<i class="' + cls(s) + '" style="height:' + Math.min(Math.floor((s.cno || 0) * 100 / 45), 100) +
      '%" title="' + tip(s) + '"></i>';
  }
  v.dots = dots;
  v.bars = bars || "<small>No satellite list from the receiver yet.</small>";
  v.bh = "dBHz" +
    (d.satellites_age_s === null || d.satellites_age_s === undefined ? "" : " &middot; list " + hms(d.satellites_age_s) + " old");
  v.pd = details(d);
  v.ps = satellites(svs);
  v.pl = logView(d.diag || []);
  return v;
}

var last = 0, every = 15;
function paint(v) {
  for (var id in v) {
    var e = document.getElementById(id);
    if (e && e.innerHTML !== v[id]) e.innerHTML = v[id];
  }
}
function stale() {
  document.body.className = "off";
  document.getElementById("sub").innerHTML = last ?
    "offline &middot; last update " + hms((Date.now() - last) / 1000) + " ago" : "no answer from the board";
}
function tick() {
  var x = new XMLHttpRequest();
  x.open("GET", "/status.json", true);
  x.timeout = 10000;
  x.onload = function () {
    try {
      var d = JSON.parse(x.responseText);
      every = d.refresh_s || 15;
      last = Date.now();
      document.body.className = "";
      paint(view(d));
    } catch (e) { stale(); }
    setTimeout(tick, every * 1000);
  };
  x.onerror = x.ontimeout = function () { stale(); setTimeout(tick, every * 1000); };
  x.send();
}
function tab(id) {
  var bs = document.querySelectorAll(".tabs button");
  for (var i = 0; i < bs.length; i++) {
    var on = bs[i].getAttribute("data-p") === id;
    bs[i].setAttribute("aria-selected", on ? "true" : "false");
    document.getElementById(bs[i].getAttribute("data-p")).hidden = !on;
  }
  try { localStorage.tab = id; } catch (e) {}
}
if (typeof document !== "undefined") {
  document.querySelector(".tabs").onclick = function (e) {
    if (e.target.getAttribute("data-p")) tab(e.target.getAttribute("data-p"));
  };
  try { if (localStorage.tab) tab(localStorage.tab); } catch (e) {}
  document.getElementById("pd").onclick = function (e) {
    var r = e.target.closest(".hr");
    if (!r) return;
    var k = r.getAttribute("data-r");
    opened[k] = !opened[k];
    r.className = "hr" + (opened[k] ? " o" : "");
  };
  tick();
}
</script>
