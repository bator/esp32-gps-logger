<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS logger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060b16'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2322d3ee' stroke-width='3' opacity='.45'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%2322d3ee'/%3E%3Cpath d='M32 5v9M32 50v9M5 32h9M50 32h9' stroke='%2322d3ee' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#060b16">
<!-- Status page of gps_logger.py, served from the board's flash as is.
     It loads once, then polls /status.json (every refresh_s from the JSON)
     and redraws the boxes. The map tiles come from OpenStreetMap and the
     fonts from Google Fonts when the phone is online. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{--b:#060b16;--l:#16233d;--t:#d6e2ff;--m:#7487ae;--a:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
body{margin:0;background:var(--b);color:var(--t);font:14px Inter,system-ui,sans-serif}
.tm,.none,.p h2,.hud,.coord,.legend,.svt{font-family:"JetBrains Mono",ui-monospace,monospace}
/* map */
.map{position:relative;height:360px;overflow:hidden;background:#0a1222}
.tiles{position:absolute;left:50%;top:42%;filter:invert(1) hue-rotate(195deg) saturate(.35) brightness(.62) contrast(1.15)}
.tiles img{position:absolute;width:256px;height:256px}
.map:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,11,22,.55) 0,rgba(6,11,22,0) 22%,rgba(6,11,22,0) 55%,var(--b) 100%),radial-gradient(circle at 50% 42%,rgba(34,211,238,.1),transparent 45%)}
.grid{position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:40px 40px}
.acc{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(34,211,238,.6);background:radial-gradient(circle,rgba(34,211,238,.18),rgba(34,211,238,.04) 70%);z-index:2}
.pin{position:absolute;left:50%;top:42%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px rgba(34,211,238,.25),0 0 22px var(--a);z-index:3}
.pin:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(34,211,238,.5);animation:p 2s infinite}
@keyframes p{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
.nofix .pin,.nofix .acc{display:none}
.coord{position:absolute;left:50%;top:42%;transform:translate(16px,-34px);font-size:11px;font-weight:600;color:var(--a);z-index:4;white-space:nowrap;text-shadow:0 0 8px rgba(34,211,238,.6)}
.nofix .coord{transform:translate(-50%,-50%);color:var(--warn);text-shadow:none;font-size:13px}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:4;max-width:1100px;margin:auto;box-sizing:border-box}
.hud h1{font-size:14px;font-weight:700;letter-spacing:.18em;margin:0;color:#fff}
.live{font-size:11px;font-weight:600;color:var(--ok);letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.off .live{color:var(--warn)}
.hud .up{margin-left:auto;color:var(--m);font-size:12px}
.trk{position:absolute;left:50%;top:42%;z-index:1;pointer-events:none}
.trk svg{position:absolute;overflow:visible}
.trk path{fill:none;stroke:#22d3ee;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 0 4px rgba(34,211,238,.7))}
.hud .day{color:var(--a);font-size:11px;font-weight:600;letter-spacing:.1em;white-space:nowrap}.hud .day em{font-style:normal}
.attr{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--m);z-index:4}
.attr a{color:inherit}
/* panels */
.wrap{max-width:1100px;margin:-96px auto 0;padding:0 16px 18px;position:relative;z-index:5;transition:opacity .3s}
.off .wrap{opacity:.5}
.tm{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:14px;overflow:hidden}
.tm div{background:rgba(10,19,38,.9);padding:11px 12px;min-width:0}
.tm small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--m)}
.tm b{display:block;font-size:22px;color:#fff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm b em{font-style:normal;font-size:11px;color:var(--m);margin-left:4px}
.wi{width:25px;height:19px;margin-right:8px;vertical-align:-1px;color:var(--a);fill:none;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 4px currentColor)}
.wi path{stroke:rgba(116,135,174,.28)}.wi .on{stroke:currentColor}.wi circle{fill:currentColor;stroke:none}
.tm b em.db{margin-left:10px}
.tm .warn .wi,.tm .bad .wi{color:inherit}
.tm .ok b{color:var(--ok);text-shadow:0 0 12px rgba(52,211,153,.5)}
.tm .warn b{color:var(--warn)}.tm .bad b{color:var(--bad)}
.g{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-top:12px}
.g>*,.sx-m>*,.sx-4>*{min-width:0}       /* (a 1fr column grows to its widest nowrap row) */
.p{background:linear-gradient(180deg,rgba(18,32,60,.75),rgba(9,16,32,.85));border:1px solid var(--l);border-radius:14px;padding:14px}
.p h2{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--m);margin:0 0 10px;text-transform:uppercase}
.col{display:flex;flex-direction:column;gap:12px}.col .p:last-child{flex:1}
/* sky radar */
.radar svg{display:block;width:100%;max-width:380px;margin:auto}
.col.l .p{flex:none}.col.l .radar{flex:1;display:flex;flex-direction:column;contain:size;min-height:320px}  /* (its own size 0: it fills what Systems leaves, not its width) */
.col.l .radar svg{flex:1;height:0;min-height:240px;max-width:none}
.rg{fill:none;stroke:rgba(34,211,238,.18)}.rx{stroke:rgba(34,211,238,.12)}
.sweep{fill:url(#sw)}
text{fill:var(--m);font:600 9px "JetBrains Mono",monospace;text-anchor:middle}
[class^=g],[class*=" g"]{--s:#94a3b8}.g0{--s:#38bdf8}.g2{--s:#34d399}.g3{--s:#fbbf24}.g6{--s:#f472b6}
circle[class^=g],circle[class*=" g"]{fill:var(--s);stroke:var(--s);stroke-width:1.2;filter:drop-shadow(0 0 4px var(--s))}
circle.u{fill:none;filter:none;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--m);margin-top:8px;justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--s);box-shadow:0 0 6px var(--s);margin-right:5px}
.legend .u i{background:none;border:1.5px solid var(--m);box-shadow:none;box-sizing:border-box}
/* signal */
/* Signal: a bar a satellite, in words (strong / fair / weak), no dB-Hz */
.sg-h{display:flex;gap:2px 22px;align-items:baseline;flex-wrap:wrap;margin:0 0 4px}.sg-h b{font:500 26px "JetBrains Mono",monospace;color:#fff}.sg-h .q-strong{color:#7fe39a}.sg-h .q-fair{color:#a3e635}.sg-h .q-weak{color:#fbbf24}.sg-h .q-none{color:#f87171}
.sg-h b em{font:400 12px "JetBrains Mono",monospace;color:#8a96ad;font-style:normal;margin-left:6px}
.sg-s{color:#8a96ad;font-size:12px;margin:0 0 10px}
.q-strong{color:#7fe39a}.q-fair{color:#a3e635}.q-weak{color:#fbbf24}.q-none{color:#f87171}
.sg-c{position:relative;height:150px;padding-right:58px}
.sg-z{position:absolute;inset:0 0 18px 0;display:flex;flex-direction:column}.sg-z i{position:relative;display:block}
.sg-z i:before{content:"";position:absolute;inset:0 58px 0 0;background:currentColor;opacity:.05}
.sg-z i.q-strong{height:30%}.sg-z i.q-fair{height:20%}.sg-z i.q-weak{height:50%}
.sg-z em{position:absolute;right:0;top:50%;transform:translateY(-50%);font:10px "JetBrains Mono",monospace;font-style:normal}
.sg-r{position:relative;display:flex;gap:4px;height:100%}
.sg-k{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.sg-k span{height:18px;line-height:18px;text-align:center;font:10px "JetBrains Mono",monospace;color:#8a96ad;overflow:hidden}
.sg-b{display:block;margin:0 18%;border-radius:3px 3px 1px 1px;background:currentColor}
.sg-b.sg-u{background:none;border:1.5px solid #7487ae;box-sizing:border-box;color:#7487ae}.sg-b.sg-0{border-style:dashed;height:3px!important}
.sg-l{font-size:11px;color:#8a96ad;margin-top:6px}.sg-l i{display:inline-block;width:9px;height:9px;border:1.5px solid #7487ae;border-radius:2px;margin:0 6px 0 14px;vertical-align:-1px}
.r .u{opacity:.25;box-shadow:none}
/* systems */

.none{font-size:12px;color:var(--m)}
/* Systems, after the "Drone Airframe Diagnostics" layout: readiness rows,
   a storage module, uplink cells, a device table */
.sx{--g:#7fe39a;--wo:#ff8a4c;--xr:#ff5d5d;--lab:#8a96ad;--ln:rgba(255,255,255,.07);padding:18px 18px 16px}
.sx-t{font:500 19px Inter,sans-serif;letter-spacing:.04em;color:#fff;margin:0}
.sx-s{font:500 11px Inter,sans-serif;letter-spacing:.08em;color:var(--lab);margin:4px 0 0;text-transform:uppercase}
.sx-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;font:500 12px Inter,sans-serif;letter-spacing:.07em;color:#dfe6f3;text-transform:uppercase}
.sx-h span{display:flex;align-items:center;gap:8px}
.sx svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.sx-h b{font:500 19px Inter,sans-serif;color:#fff;letter-spacing:0}
.sx-seg{display:flex;gap:4px;margin:2px 0 10px}
.sx-seg i{flex:1;height:6px;border-radius:1px;background:var(--g);box-shadow:0 0 8px rgba(127,227,154,.7)}
.sx-seg.warn i{background:var(--wo);box-shadow:0 0 8px rgba(255,138,76,.6)}.sx-seg.bad i{background:var(--xr);box-shadow:0 0 8px rgba(255,93,93,.6)}
.sx-seg i.off{background:#3a4458;box-shadow:none}
.sx-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);font:500 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#dfe6f3}
.sx-r:last-of-type{border-bottom:0}
.sx-r span{display:flex;align-items:center;gap:10px;min-width:0}
.sx-r em{font-style:normal;color:var(--lab);letter-spacing:.03em;text-transform:none;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx-r i{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g);flex:none}
.sx-r b{font-weight:500;color:var(--g);white-space:nowrap}
.sx .warn i,.sx-r.warn i{background:var(--wo);box-shadow:0 0 6px var(--wo)}.sx-r.bad i{background:var(--xr);box-shadow:0 0 6px var(--xr)}
.sx-r.warn b,.sx .warn>b,.sx b.warn{color:var(--wo)}.sx-r.bad b,.sx .bad>b,.sx b.bad{color:var(--xr)}
.sx-m{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;background:rgba(255,255,255,.035);border:1px solid var(--ln);border-radius:10px;padding:16px}
.sx-big{font:500 40px Inter,sans-serif;color:var(--g);text-shadow:0 0 18px rgba(127,227,154,.35);line-height:1;white-space:nowrap}
.sx .sx-big small{display:inline;font:500 22px Inter,sans-serif;letter-spacing:0;color:inherit;text-transform:none}
.sx-big.warn{color:var(--wo);text-shadow:none}.sx-big.bad{color:var(--xr);text-shadow:none}
.sx-bl{font:500 11px Inter,sans-serif;letter-spacing:.08em;color:var(--lab);margin-top:8px;text-transform:uppercase}
.sx-4{display:grid;grid-template-columns:1fr 1fr;row-gap:14px}
.sx-4 div{padding-left:12px;border-left:1px solid var(--ln)}
.sx small{display:block;font:500 10.5px Inter,sans-serif;letter-spacing:.07em;color:var(--lab);text-transform:uppercase}
.sx-4 b,.sx-c b{display:block;font:500 17px Inter,sans-serif;color:#fff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx b em{font:400 12px Inter,sans-serif;color:var(--lab);font-style:normal;margin-left:3px}
.sx-cs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sx-c{background:rgba(255,255,255,.045);border-radius:6px;padding:12px 10px;min-width:0;color:var(--lab)}
.sx-c svg{width:14px;height:14px;margin-bottom:8px}
.sx-c b.ok{color:var(--g)}
.sx-k{width:100%;border-collapse:collapse}
.sx-k td{padding:7px 0;font:500 12px Inter,sans-serif;letter-spacing:.06em;color:var(--lab);text-transform:uppercase}
.sx-k td+td{text-align:right;color:#fff;letter-spacing:.02em;text-transform:none;font-size:14px}
.sx-k td.warn{color:var(--wo)}
.sx-chip{display:inline-block;border:1px solid rgba(127,227,154,.45);background:rgba(127,227,154,.08);color:var(--g);font:600 10.5px Inter,sans-serif;letter-spacing:.06em;padding:4px 7px;border-radius:3px;margin-left:8px;vertical-align:1px;text-transform:uppercase}
/* log + satellite table */
/* GPS telemetry, after "Orbital Systems" (Orizon, dribbble 27639068): a
   graphite panel with cut corners, a dot-matrix accuracy chart, amber anomaly */
.gt{position:relative;margin-bottom:12px;background:radial-gradient(120% 140% at 50% 0%,#1d2622 0%,#121816 55%,#0d1110 100%);padding:18px 20px 20px;color:#e7efe9;font-family:Inter,sans-serif;
 clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.gt:before,.gt-b:before,.gt-an:before{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(214,232,222,.16);clip-path:inherit}
.gt-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gt-hd h3{font:400 21px Audiowide,"JetBrains Mono",monospace;margin:0;color:#e7efe9}.gt-hd h3 small{display:block;font:400 11px Inter,sans-serif;color:#8b9590;margin-top:6px}
.gt-chip{font:400 11px Audiowide,monospace;padding:5px 10px;border:1px solid rgba(214,232,222,.16);color:#d7ece0;background:rgba(215,236,224,.06)}
.gt-chip.a{color:#f5a524;border-color:rgba(245,165,36,.4);background:rgba(245,165,36,.08)}
.gt-g{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.gt-g>*{min-width:0}
.gt-b{position:relative;background:rgba(255,255,255,.025);padding:14px 16px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.gt-l{font:400 12px Audiowide,monospace}.gt-l em{font:400 11px Inter,sans-serif;font-style:normal;color:#8b9590;margin-left:8px}
.gt-big{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:6px 0 10px}.gt-big b{font:400 30px Audiowide,monospace}
.gt-big span{font:500 11px "JetBrains Mono",monospace;color:#d7ece0}
.gt-dm{display:flex;gap:2px;align-items:flex-end;height:96px;margin-left:34px}.gt-c{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;min-width:0}
.gt-c s{display:block;flex:1;background:rgba(215,236,224,.07)}.gt-c s.on{background:#d7ece0}.gt-c s.am{background:#f5a524}.gt-c s.rd{background:#ef8a4c}.gt-c.x s:first-child{background:#ef5b4c}
.gt-ax{display:flex;justify-content:space-between;font:500 10.5px "JetBrains Mono",monospace;color:#8b9590;margin-top:6px}
.gt-lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#8b9590}.gt-lg b{display:inline-block;width:8px;height:8px;margin-right:6px;background:#d7ece0}
.gt-lg b.am{background:#f5a524}.gt-lg b.rd{background:#ef8a4c}.gt-lg b.x{background:#ef5b4c}
.gt-dg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.gt-dg svg{display:block;width:100%;height:40px}
.gt-dg small{display:block;font-size:11px;color:#8b9590;margin-top:4px}.gt-dg b{font:500 14px "JetBrains Mono",monospace}.gt-dg b em{font:400 11px Inter,sans-serif;font-style:normal;color:#8b9590}
.gt-lk{display:flex;align-items:center;gap:8px;margin-top:6px}.gt-lk span{font:500 10px "JetBrains Mono",monospace;color:#8b9590;width:26px;flex:none}
.gt-lk div{flex:1;display:flex;gap:2px;height:8px;min-width:0}.gt-k{flex:1;min-width:0;background:rgba(215,236,224,.07)}.gt-k.ok{background:#7fbf9a}.gt-k.am{background:#f5a524}.gt-k.rd{background:#ef5b4c}
.gt-mks{position:relative;height:22px;margin:2px 0 0 34px}.gt-mk{position:absolute;top:0;transform:translateX(-50%);font:500 10px "JetBrains Mono",monospace;color:#ef5b4c;white-space:nowrap;text-align:center}
.gt-mk i{display:block;width:0;height:0;margin:0 auto 2px;border:4px solid transparent;border-bottom-color:#ef5b4c;border-top:0}
.gt-ax{padding-left:34px}.gt-lg .gt-sep{margin-left:6px;color:#d7ece0}.gt-lg b.ok{background:#7fbf9a}
.gt-n{display:block;font:400 26px Audiowide,monospace!important}
.gt-an>p{display:flex;justify-content:space-between;margin:0;padding:6px 0;border-top:1px solid rgba(245,165,36,.18);font:500 12px "JetBrains Mono",monospace;color:#ffe2b0}
.gt-an>p b{font-weight:500;color:#f5a524}.gt-an>p.gt-more{color:#b9a27a;font-size:11px}
.gt-ok{margin:12px 0 0;font-size:12px;color:#8b9590}
.gt-n.a{color:#f5a524}.gt-n em{font:400 12px Inter,sans-serif;font-style:normal;color:#8b9590;margin:0 2px}
.gt-bad{margin:12px 0 0;font-size:12px;color:#8b9590}.gt-bad b{font:500 13px "JetBrains Mono",monospace;color:#e7efe9}

.gt-an{position:relative;margin-top:14px;background:linear-gradient(180deg,rgba(245,165,36,.16),rgba(245,165,36,.05));padding:12px 14px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.gt-an:before{border-color:rgba(245,165,36,.45)}
.gt-an h4{margin:0 0 8px;font:400 13px Audiowide,monospace;color:#ffe2b0;display:flex;gap:10px;align-items:center}
.gt-an h4 i{width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(245,165,36,.6);font-style:normal;color:#f5a524;font-size:12px}
/* Event log, aggregated (Sentry / Loki patterns): KPI tiles, GPS telemetry,
   the events grouped by kind */
.ev{--g:#7fe39a;--lab:#8a96ad;--ln:rgba(255,255,255,.07);margin-top:12px;padding:18px;font-family:"JetBrains Mono",ui-monospace,monospace}
.ev-t{font:500 26px "JetBrains Mono",monospace;color:#fff;margin:0 0 2px}
.ev-s{font:400 12px "JetBrains Mono",monospace;color:var(--lab);margin:0 0 16px}
.ev-k4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ev-k4 div{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;min-width:0}
.ev-k4 small{display:block;font-size:10.5px;color:var(--lab);letter-spacing:.06em;text-transform:uppercase}
.ev-k4 b{font:500 22px "JetBrains Mono",monospace;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-k4 b em{font:400 12px "JetBrains Mono",monospace;color:var(--lab);font-style:normal;margin-left:4px}
.ev-k4 .t-ok b{color:var(--g)}.ev-k4 .t-warn b{color:var(--warn)}
.ev-card{background:rgba(0,0,0,.25);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;min-width:0}
.ev-card+.ev-card{margin-top:12px}
.ev-card h3{font:500 14px "JetBrains Mono",monospace;color:#fff;margin:0 0 2px}.ev-card>p{margin:0 0 10px;font-size:12px;color:var(--lab)}
.ev-leg{display:flex;gap:14px;font-size:11px;color:var(--lab);margin-top:6px}
.ev-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--g)}.ev-leg .u i{background:var(--a)}
/* the chart: lines in a stretched SVG (strokes kept thin), labels in HTML */
.ev-pl{position:relative;height:160px;margin:8px 4px 24px 26px}
.ev-pl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ev-pl line{stroke:rgba(255,255,255,.06);vector-effect:non-scaling-stroke}
.ev-pl path{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.ev-pl .s{stroke:var(--g);stroke-width:1.6}.ev-pl .u{stroke:var(--a);stroke-width:1.4;opacity:.9}
.ev-pl span{position:absolute;font-size:10px;color:var(--lab);line-height:1}
.ev-pl .y{left:-26px;width:20px;text-align:right;transform:translateY(-50%)}
.ev-pl .x{top:100%;margin-top:7px;transform:translateX(-50%)}
.ev-grp{display:grid;grid-template-columns:30px 1.3fr 64px 2fr 150px 54px;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;font-size:12.5px}
.ev-grp:nth-child(even){background:rgba(255,255,255,.025)}
.ev-grp.ev-hd{font-size:10.5px;color:var(--lab);letter-spacing:.08em;border-bottom:1px solid var(--ln);border-radius:0;background:none}
.ev-grp>*{min-width:0}
.ev-ic{position:relative;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.ev-ic:before{content:"";position:absolute;inset:0;border-radius:7px;background:currentColor;opacity:.14}
.ev-ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ev-nm{overflow:hidden;text-overflow:ellipsis}
.ev-n{font:600 18px "JetBrains Mono",monospace;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
.ev-hd .ev-n{font:inherit;color:inherit}
.ev-dt{color:#c9d3e6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev-dt em{color:var(--lab);font-style:normal}
.ev-sk{display:flex;gap:2px;align-items:flex-end;height:22px}.ev-sk i{flex:1;background:rgba(255,255,255,.06);border-radius:2px;min-height:2px}
.ev-sk i.on{background:currentColor}
.ev-lt{color:var(--lab);text-align:right;white-space:nowrap}
.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}.t-ok{color:var(--g)}.t-boot{color:var(--a)}.t-mut{color:var(--m)}
details.p{margin-top:12px}
details summary{cursor:pointer;font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.16em;color:var(--m);text-transform:uppercase}
.svt{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.svt td{padding:3px 6px;border-top:1px solid var(--l);text-align:right}
.svt td:first-child{text-align:left}.svt .u td{color:var(--m)}
/* GPS link alert and the track panel */
.alert{margin-bottom:12px;padding:11px 14px;border:1px solid var(--bad);border-radius:14px;background:rgba(248,113,113,.12);color:var(--bad);font:600 12px "JetBrains Mono",monospace;letter-spacing:.08em}
.alert em{font-style:normal;color:var(--t);font-weight:400;margin-left:8px}
.alert:empty{display:none}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ph h2{margin:0;margin-right:auto}
.btn{font:600 11px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--a);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.35);border-radius:8px;padding:5px 9px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.dn{font:600 12px "JetBrains Mono",monospace;letter-spacing:.08em;color:#fff;min-width:96px;text-align:center}
.kpi{display:flex;gap:22px;font-family:"JetBrains Mono",monospace;margin-bottom:12px}.kpi b{font-size:22px;color:#fff}.kpi em{font-style:normal;font-size:11px;color:var(--m);margin-left:4px}
.tr{display:grid;grid-template-columns:50px 18px 1fr;min-height:30px;font:12.5px "JetBrains Mono",monospace;line-height:16px}
.tr time{color:#fff;font-weight:600}.tr span{color:var(--m);padding-left:8px}
.tr i{position:relative}
.tr i:before{content:"";position:absolute;left:4px;top:3px;width:10px;height:10px;border-radius:50%;box-sizing:border-box;background:var(--b);border:2px solid var(--m)}
.tr i:after{content:"";position:absolute;left:8px;top:13px;bottom:-3px;border-left:2px dashed rgba(116,135,174,.45)}
.tr.go i:before{background:var(--a);border-color:var(--a);box-shadow:0 0 8px var(--a)}
.tr.go i:after{border-left:3px solid var(--a);left:7.5px;box-shadow:0 0 6px rgba(34,211,238,.5)}
.tr.go{cursor:pointer}.tr.go span{color:var(--t)}.tr.go span b{color:#fff}
.tr.go:hover span,.tr.go.on span,.tr.go.on span b{color:var(--a)}.tr.go.on i:after{border-left-color:#fff}
.tr.end i:after{display:none}
.trk path.hl{stroke:#fff;stroke-width:5;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
.hint{font-size:11px;color:var(--m);margin-top:8px}
/* a narrow HUD wraps whole items (offline with a day's km it needs ~490 px;
   squeezed, the uptime broke over 5 lines into the map); the uptime of the
   last answer is not shown offline */
@media(max-width:760px){.hud{flex-wrap:wrap;row-gap:6px}.hud>*{white-space:nowrap}.off .hud .up{display:none}
.hud .day em{display:none}.tm{grid-template-columns:repeat(3,1fr)}.tm b{font-size:19px}.tm .db{display:none}.wi{width:18px;height:14px;margin-right:5px}.g{grid-template-columns:1fr}.ev-k4{grid-template-columns:repeat(2,1fr)}.gt-g{grid-template-columns:1fr}.gt-dm{height:80px}.ev-grp{grid-template-columns:28px 1fr auto;grid-template-areas:"ic nm n" "ic dt lt" ". sk sk";gap:3px 10px;padding:9px 6px}.ev-grp.ev-hd{display:none}.ev-grp .ev-ic{grid-area:ic;align-self:start}.ev-grp .ev-nm{grid-area:nm;white-space:nowrap}.ev-grp .ev-n{grid-area:n}.ev-grp .ev-dt{grid-area:dt;font-size:11.5px;color:var(--lab)}.ev-grp .ev-lt{grid-area:lt;font-size:11.5px}.ev-grp .ev-sk{grid-area:sk;height:12px;margin-top:3px;overflow:hidden}.ev-grp .ev-sk i{max-height:12px}.col.l .radar{contain:none;min-height:0}.col.l .radar svg{flex:none;height:auto;min-height:0;max-width:380px}.map{height:300px}.wrap{margin-top:-70px}.coord{transform:translate(-50%,16px)}}
</style>
</head>
<body>
<div class="map nofix" id="map">
  <div class="tiles" id="tiles"></div><div class="grid"></div><div class="trk" id="trk"></div>
  <div class="acc" id="acc"></div><div class="pin" id="pin"></div><div class="coord" id="coord">connecting&hellip;</div>
  <div class="hud"><h1>GNSS&middot;TELEMETRY</h1><span class="live" id="live">LIVE</span><span class="day" id="day"></span><span class="up" id="up"></span></div>
  <div class="attr">&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></div>
</div>
<div class="wrap">
  <div class="alert" id="gl"></div>
  <div class="tm" id="tm"></div>
  <div class="g">
    <!-- the radar takes what the left column has left next to Systems -->
    <div class="col l">
      <div class="p radar"><h2 id="skyh">Sky</h2>
        <svg viewBox="-104 -104 208 208">
          <defs><radialGradient id="sw" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="scale(90)"><stop offset="0" stop-color="rgba(34,211,238,.18)"/><stop offset="1" stop-color="rgba(34,211,238,0)"/></radialGradient></defs>
          <path class="sweep" d="M0 0L0-90A90 90 0 0 1 77.9-45Z"/>
          <circle class="rg" r="90"/><circle class="rg" r="60"/><circle class="rg" r="30"/>
          <path class="rx" d="M0-90V90M-90 0H90M-63.6-63.6L63.6 63.6M63.6-63.6L-63.6 63.6"/>
          <text y="-94">N</text><text x="97" y="3">E</text><text y="101">S</text><text x="-97" y="3">W</text>
          <g id="dots"></g>
        </svg>
        <div class="legend"><span class="g0"><i></i>GPS</span><span class="g2"><i></i>GAL</span><span class="g3"><i></i>BDS</span><span class="g6"><i></i>GLO</span><span class="g1"><i></i>OTHER</span><span class="u"><i></i>NOT USED</span></div>
      </div>
      <div class="p"><div class="ph"><h2>Track</h2><button class="btn" id="dprev" onclick="step(-1)">&lsaquo;</button><span class="dn" id="dname">TODAY</span><button class="btn" id="dnext" onclick="step(1)">&rsaquo;</button><button class="btn" id="gpx" onclick="gpxSave()">GPX</button></div>
        <div class="kpi" id="tkpi"></div><div id="tline"></div></div>
      <div class="p sg"><h2>Signal</h2><div id="sig"></div></div>
    </div>
    <div class="col">
      <div class="p sx" id="sys"></div>
    </div>
  </div>
  <!-- the whole diag log on the board, aggregated: tiles, satellites, events by kind -->
  <div class="p ev"><p class="ev-t">Event log</p><p class="ev-s" id="evs">reading the diag log&hellip;</p>
    <div class="ev-k4" id="evk"></div>
    <div id="evt"></div>
    <div class="ev-card"><h3>Events, grouped</h3><p>what repeats, how often, when it was last seen</p><div id="evg"></div></div>
  </div>
  <details class="p"><summary id="svh">Satellite table</summary><table class="svt" id="svt"></table></details>
</div>
<script>
var GNSS = {GPS: 0, SBAS: 1, Galileo: 2, BeiDou: 3, QZSS: 5, GLONASS: 6};
// machine.reset_cause() of MicroPython 1.29 on the ESP32: 1 also a brownout,
// 2 also machine.reset() and a panic, 0 a USB/JTAG or unknown reset
var BOOT = {0: "other reset", 1: "power on", 2: "hard reset", 3: "watchdog", 4: "deep sleep", 5: "soft reset"};
var TLS_KB = 48;                        // TLS_MIN_KB in gps_logger.py
var POINT_B = 7;                        // bytes per .trb point (7.0-7.3 on a 1 Hz drive; .trk ~46-51)
var UERE = 2.5;                         // m per HDOP unit for the accuracy ring
var MAX_HACC = 20;                      // PVT_MAX_HACC in gps_logger.py
var ZOOM = 17;
// every status.json key the page shows (tests check none is missing)
var SHOWN = ("fix sats hdop hacc fix_src ubx utc position nmea rx_bytes rx_age_s good_age_s gps_boots gps_loops " +
  "receiver setup_ok points left files bad_files sent upload upload_err upload_age_s days stay uptime prev_run " +
  "boot_cause temp mhz mem heap_kb idf flash_kb wifi rssi pulses fw ota prev_end fw_build").split(" ");
var GPS_OK_S = 3, GPS_SILENT_S = 10;   // s since the last whole NMEA/UBX frame: amber, red
var UPLOAD_LATE_S = 1800;               // points waiting and no upload for this long: amber
var OTHER = ["device", "refresh_s", "diag", "satellites", "satellites_age_s", "prev_uptime", "web_errs",
  "track_drop", "write_errs", "q_thin", "pos6"];   // raw status.json only

function esc(v) {
  if (v === null || v === undefined) return "-";
  if (v === true) return "yes";
  if (v === false) return "no";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function nn(s) { return s === undefined || s === "" || s === "None" || s === "-" ? null : s; }   // Python None in a text
function two(n) { return (n < 10 ? "0" : "") + n; }
function prevText(d) {                  // the run before this boot
  var t = typeof d.prev_uptime === "number" ? hms(d.prev_uptime) : String(d.prev_run);
  if (/crash/.test(d.prev_run)) return t + ", ended by a crash";
  if (/^under/.test(d.prev_run)) return String(d.prev_run);
  var e = d.prev_end ? Date.parse(d.prev_end) : NaN;
  return t + (isNaN(e) ? "" : ", until " + when(e));
}
function hms(s) {                       // as _hms() in gps_logger.py
  if (s === null || s === undefined) return "-";
  s = Math.floor(s);
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min " + two(s % 60) + " s";
  if (s < 86400) return Math.floor(s / 3600) + " h " + two(Math.floor(s / 60) % 60) + " min";
  return Math.floor(s / 86400) + " d " + two(Math.floor(s / 3600) % 24) + " h";
}
function num(n) { return n === null || n === undefined ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function gid(sv) { return GNSS[sv.system] === undefined ? 1 : GNSS[sv.system]; }
function cls(sv) { return "g" + gid(sv) + (sv.used ? "" : " u"); }
function tip(sv) { return esc(sv.name) + " " + esc(sv.cno || "-") + " dBHz"; }
function fixTone(fix) { return fix.indexOf("3D") === 0 ? "ok" : fix.indexOf("fix") >= 0 ? "warn" : "bad"; }
function tile(lat, lon, z) {            // slippy-map tile and pixel offset in it
  var n = Math.pow(2, z), r = lat * Math.PI / 180;
  var x = (lon + 180) / 360 * n, y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
  return {x: Math.floor(x), y: Math.floor(y), fx: (x - Math.floor(x)) * 256, fy: (y - Math.floor(y)) * 256,
    mpp: 156543.03 * Math.cos(r) / n};
}
function wifiQ(rssi) {                 // [arcs 0-3, quality %, tone] for an RSSI in dBm
  if (rssi === null || rssi === undefined) return null;
  return [rssi >= -60 ? 3 : rssi >= -67 ? 2 : rssi >= -80 ? 1 : 0, Math.max(0, Math.min(100, Math.round(2 * (rssi + 100)))),
    rssi >= -67 ? "" : rssi >= -80 ? "warn" : "bad"];
}
var ARCS = ["M8.5 12.5A5 5 0 0 1 15.5 12.5", "M5.6 9.6A9 9 0 0 1 18.4 9.6", "M2.8 6.8A13 13 0 0 1 21.2 6.8"];
function wifiIcon(n) {                  // a dot and three arcs, n lit
  var h = '<svg class="wi" viewBox="0 0 24 18"><circle cx="12" cy="15.5" r="2"/>';
  for (var i = 0; i < 3; i++) h += '<path' + (i < n ? ' class="on"' : "") + ' d="' + ARCS[i] + '"/>';
  return h + "</svg>";
}
function cell(label, value, unit, tone) {
  return '<div class="' + (tone || "") + '"><small>' + label + "</small><b>" + value + (unit ? "<em>" + unit + "</em>" : "") +
    "</b></div>";
}
// Event log: the whole diag log on the board (DIAG_OLD, then DIAG_FILE, read
// with /diag; ~26 h), aggregated as it is read: status lines (one a minute)
// into the fix tiles and 5-minute satellite means, every other line into its
// kind. An event line has no time: it takes the next status line's with a
// utc (one without utc counts its minute, but is not on the chart).
// The kinds: [key, test, name, severity (rows sorted by it), tone, icon]
var EVK = [
  ["crash", /^crash /, "Crash", 3, "bad", "bug"],
  ["bug", /^(bug|web error) /, "Caught bug", 3, "bad", "bug"],
  ["gloop", /^gps reset loop /, "GPS reset loop", 3, "bad", "loop"],
  ["gsil", /^gps (silent|back) /, "GPS silent", 3, "bad", "mute"],
  ["track", /^(track \S+ (failing|error) |upload: )/, "Track write error", 3, "bad", "disk"],
  ["full", /^track full /, "Flash full", 3, "bad", "disk"],
  ["upl", /^upload (err|aborted|ca err) /, "Upload error", 3, "bad", "up"],
  ["ota", /^ota \S+ (installed|booted|ok$|set to boot|.*(rolled|rolling) back)/, "Firmware update", 1, "ok", "ota"],
  ["otax", /^ota/, "Update check", 2, "warn", "ota"],
  ["reboot", /^reboot /, "Reboot for memory", 2, "warn", "power"],
  ["tback", /^time back /, "Clock went back", 2, "warn", "clock"],
  ["wfail", /^wifi fail /, "WiFi connect failed", 2, "warn", "wifi"],
  ["wlost", /^wifi lost /, "WiFi lost", 2, "warn", "wifi"],
  ["low", /^upload low /, "Upload waits for memory", 2, "warn", "up"],
  ["setup", /^gps (setup not taken|rate )/, "GPS setup refused", 2, "warn", "sat"],
  ["pvt", /^gps pvt /, "NAV-PVT given up", 2, "warn", "sat"],
  ["env", /^(env |upload (API_KEY|GEO_URL) )/, "Config (.env)", 2, "warn", "cfg"],
  ["boot", /^boot cause /, "Boot", 1, "boot", "power"],
  ["wback", /^wifi back /, "WiFi back", 1, "ok", "wifi"],
  ["stay", /^stay left /, "Stay ended", 0, "mut", "dot"],
  ["grx", /^gps /, "Receiver start", 0, "mut", "sat"],
  ["other", /^/, "Other", -1, "mut", "dot"]
];
var EVI = {
  bug: '<path d="M8 3h8l5 5v8l-5 5H8l-5-5V8zM12 8v5M12 16.5h.01"/>',
  loop: '<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
  mute: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  disk: '<path d="M4 4h12l4 4v12H4zM8 4v5h7V4M8 20v-6h8v6"/>',
  up: '<path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"/>',
  ota: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  power: '<path d="M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  wifi: '<path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a14 14 0 0 1 20 0M12 19.5h.01"/>',
  sat: '<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  cfg: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  dot: '<circle cx="12" cy="12" r="2.5"/>'
};
var EV_STATUS = /^up \d+ utc (\S+) .*? sats (\d+)\/(\S+) fix (\S+)/, EV_PEND = 500;
var EV_LINK = /^up (\d+) .*? nmea (\d+)\/(\d+) .*? hdop (\S+)/;
function evKind(l) {
  if (/^up \d+ utc /.test(l)) return "status";
  for (var i = 0; i < EVK.length; i++) if (EVK[i][1].test(l)) return EVK[i][0];
  return "other";
}
function evNew() {                      // the aggregate of a diag log read so far
  return {rest: "", n: 0, n3: 0, nno: 0, t0: null, t1: null, b5: {}, bk: [], g: {}, pend: [],
    lk: null, lt: null, tu: null, drops: 0, run: 0, lng: 0, bad: 0, okn: 0, up: 0, dn: 0, eps: []};
}
// UTC "20261102T091639Z" -> ms, or null
function evUtc(u) {
  var m = /^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/.exec(u);
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
}
// a reply's text (one char a byte: x-user-defined) -> whole lines, the cut
// one kept for the next; a line with a non-ASCII byte (an SSID) as UTF-8
function evFeed(a, t) {
  var ls = (a.rest + t).split("\n");
  a.rest = ls.pop();
  if (a.rest.length > 4096) a.rest = "";
  for (var i = 0; i < ls.length; i++) evLine(a, evUtf8(ls[i]));
}
function evEnd(a) { if (a.rest) evLine(a, evUtf8(a.rest)); a.rest = ""; }   // the end of a file
function evUtf8(s) {
  if (!/[^\x00-\x7f]/.test(s)) return s;
  var b = s.replace(/[\uf780-\uf7ff]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xf700); });
  try { return decodeURIComponent(escape(b)); } catch (e) { return b; }
}
function evLine(a, l) {
  if (!l) return;
  if (/^up \d+ utc /.test(l)) {
    var m = EV_STATUS.exec(l);
    if (!m) return;
    a.n++;
    if (/^3D/.test(m[4])) a.n3++;
    else if (!/^2D/.test(m[4])) a.nno++;
    var t = evUtc(m[1]), up = +/^up (\d+)/.exec(l)[1], r = t;
    if (t === null) return;
    // a silent receiver: the line repeats the last GPS time (the board's
    // clock), its time goes on with up
    if (a.tu && t === a.tu[0] && up > a.tu[1]) t = a.tu[2] + (up - a.tu[1]) * 1000;
    a.tu = [r, up, t];
    if (a.t0 === null) a.t0 = t;
    a.t1 = t;
    var k = Math.floor(t / 300000), b = a.b5[k];
    if (!b) { b = a.b5[k] = [t, 0, 0, 0, 0, 0, 0]; a.bk.push(k); }
    b[1] += +m[2] || 0; b[2] += +m[3] || 0; b[3]++;
    evLink(a, l, b, /^(3D|2D|Fix)/.test(m[4]), t);
    for (var i = 0; i < a.pend.length; i++) evAdd(a.g, a.pend[i][0], a.pend[i][1], t);
    a.pend = [];
    return;
  }
  a.pend.push([evKind(l), l]);
  // (no utc for hours: the oldest at the last time known)
  if (a.pend.length > EV_PEND) { var p = a.pend.shift(); evAdd(a.g, p[0], p[1], a.t1); }
}
// the receiver link and accuracy from a status line: its NMEA count against
// the line before (a boot starts it again: up or the count goes back, or a
// gap over 3 min), a minute it stood still is a drop-out minute (the board
// ran, the receiver sent nothing); HDOP while there was a fix. b: the
// 5-minute bucket [.., hdop sum, its count, drop-out minutes]
function evLink(a, l, b, fix, t) {
  var m = EV_LINK.exec(l);
  if (!m) return;
  var up = +m[1], ok = +m[2], er = +m[3], h = parseFloat(m[4]), p = a.lk, pt = a.lt;

// from where it got to. X-Diag-Size is the file's size: DIAG_FILE smaller
// than where the page got to (it became DIAG_OLD), or DIAG_OLD another size
// while it is read: both again from the start (the aggregate anew).
var dg = dgNew();
function dgNew() { return {f: 1, off: [0, 0], s1: null, busy: false, done: false, at: 0, a: evNew()}; }
function diagDue() { return !dg.busy && Date.now() - dg.at >= 60000; }
function diagLoad() { dg.busy = true; diagNext(); }
function diagNext() {
  var g = dg, f = g.f, o = g.off[f], x = new XMLHttpRequest();
  x.open("GET", "/diag?f=" + f + "&o=" + o, true);
  x.overrideMimeType("text/plain; charset=x-user-defined");   // one char a byte: o counts bytes
  x.timeout = 10000;
  function fail() { if (g === dg) { g.busy = false; g.at = Date.now(); evPaint(); } }
  x.onload = function () {
    if (g !== dg) return;
    if (x.status !== 200 && x.status !== 404) { fail(); return; }   // (404: no such file)
    var ok = x.status === 200, t = ok ? x.responseText : "", hs = ok ? x.getResponseHeader("X-Diag-Size") : null;
    var size = hs === null ? o + t.length : +hs;
    if (ok && (f === 0 ? size < o : g.s1 !== null && size !== g.s1)) { dg = dgNew(); diagLoad(); return; }
    if (ok && f === 1) g.s1 = size;
    if (t) { evFeed(g.a, t); g.off[f] = o + t.length; }
    if (t && g.off[f] < size) { evPaint(); diagNext(); return; }
    if (f === 1) { evEnd(g.a); g.f = 0; diagNext(); return; }
    g.busy = false;
    g.done = true;
    g.at = Date.now();
    evPaint();
  };
  x.onerror = x.ontimeout = fail;
  x.send();
}
function evPaint() {                    // (a matrix column at least 8 px wide)
  var e = document.getElementById("evt"), w = e && e.clientWidth ? e.clientWidth : 1000;
  dg.cols = Math.max(12, Math.min(96, Math.floor(w * .58 / 8)));
  paint(evView(dg.a, dg));
}
// world pixels (256 a tile at zoom 0) of a position at zoom z
function wpx(lat, lon, z) {
  var k = 256 * Math.pow(2, z), r = lat * Math.PI / 180;
  return [(lon + 180) / 360 * k, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * k];
}
// The view: the position and the day's track fitted between the header
// and the telemetry strip, centred on them. A fractional zoom (ZOOM at
// most, 13 at least): the tiles of the zoom above, scaled down (sc <= 1,
// crisp). -> the tile zoom, the scale and the world pixel at the map's
// anchor (50%, 42%). live: lat, lon is a fix (it stays on the map even when
// the track is wider than zoom 13 shows)
function fitView(lat, lon, el, live) {
  var w = el.offsetWidth, h = el.offsetHeight, top = 44, bot = h - 90, zf = ZOOM;
  // a past day: its track alone (the live position may be far away)
  // a trip picked in the timeline: that trip alone
  var hl = hlRange(), x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, withMe = !hl && !(hist.past && hist.pts.length);
  var ps = hl ? hist.pts.slice(hl[0], hl[1] + 1) : withMe ? hist.pts.concat([[0, lat, lon]]) : hist.pts;
  for (var i = 0; i < ps.length; i++) {
    var q = wpx(ps[i][1], ps[i][2], 0);
    x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
  }
  if (x1 > x0) zf = Math.min(zf, Math.log((w - 48) / (x1 - x0)) / Math.LN2);
  if (y1 > y0) zf = Math.min(zf, Math.log((bot - top - 32) / (y1 - y0)) / Math.LN2);
  zf = Math.max(13, zf);
  var z = Math.ceil(zf - 1e-9), k = Math.pow(2, z), sc = Math.pow(2, zf - z);
  var me = wpx(lat, lon, z);
  if (hist.pts.length < 2) {            // a past day's one point: on it (the fix may be far away)
    var c = withMe || !hist.pts.length ? me : wpx(hist.pts[0][1], hist.pts[0][2], z);
    return {z: z, sc: sc, X: c[0], Y: c[1]};
  }
  var X = (x0 + x1) / 2 * k, Y = (y0 + y1) / 2 * k + (h * .42 - (top + bot) / 2) / sc;
  // today's track wider than zoom 13 shows: the centre moved just enough to
  // keep the position on the map (24 px from the sides, 16 from the bands)
  if (live && withMe) {
    var mx = (w / 2 - 24) / sc, ya = (h * .42 - top - 16) / sc, yb = (bot - 16 - h * .42) / sc;
    X = Math.min(Math.max(X, me[0] - mx), me[0] + mx);
    Y = Math.min(Math.max(Y, me[1] - yb), me[1] + ya);
  }
  return {z: z, sc: sc, X: X, Y: Y};
}
function hlRange() {
  var t = hist.hl === null || hist.hl === undefined || !hist.trips ? null : hist.trips[hist.hl];
  return t ? [t.i0, t.i1] : null;
}
function histPath(t, z, i0, i1) {       // SVG path in the tile layer's pixels
  var k = Math.pow(2, z), d = "", prev = 0;
  i0 = i0 || 0;
  i1 = i1 === undefined ? hist.pts.length - 1 : i1;
  for (var i = i0; i <= i1; i++) {
    var p = hist.pts[i], r = p[1] * Math.PI / 180;
    var x = ((p[2] + 180) / 360 * k - t.x) * 256, y = ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * k - t.y) * 256;
    d += (i > i0 && p[0] - prev <= 300000 ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    prev = p[0];
  }
  return d;
}

// the Track panel and the header's day, when the shown track changed
var tpKey = "";
function trackPaint() {
  var k = hist.start + "/" + hist.pts.length + "/" + hist.hl;
  if (k === tpKey) return;
  tpKey = k;
  if (hist.trips === undefined || hist.tn !== hist.pts.length) { hist.trips = tripsOf(hist.pts); hist.tn = hist.pts.length; }
  var km = 0;                            // the trips' km, as the timeline sums them
  for (var j = 0; j < hist.trips.length; j++) km += hist.trips[j].km;
  document.getElementById("day").innerHTML = hist.trips.length ? "<em>" + (hist.past ? dayName() : "TODAY") + " </em>" +
    km.toFixed(2) + " KM" : "";
  paint({tkpi: kpis(hist.trips), tline: timeline(hist.trips, hist.hl, hist.past)});
  navPaint();
  document.getElementById("gpx").disabled = !hist.pts.length;
}

// The map: tiles around the position, rebuilt only when the centre tile
// changes; the fraction moves the layer (no reload every poll)
var mapKey = "", trkKey = "", mapD = null;
function placeMap(d) {
  mapD = d;
  var el = document.getElementById("map"), p = String(d.position || "").split(", ");
  var fix = p.length === 2 && !isNaN(+p[0]) && !isNaN(+p[1]);
  trackPaint();
  // without a fix the day's track is still drawn (the pin hidden)
  if (!fix && !hist.pts.length) { el.className = "map nofix"; return; }
  el.className = fix ? "map" : "map nofix";
  var lat = fix ? +p[0] : hist.pts[0][1], lon = fix ? +p[1] : hist.pts[0][2];
  // tiles to cover the element from its centre (a wide screen needs more)
  var v = fitView(lat, lon, el, fix), z = v.z, sc = v.sc, me = wpx(lat, lon, z);
  var nx = Math.ceil(el.offsetWidth / 512 / sc) + 1, ny = Math.ceil(el.offsetHeight / 512 / sc) + 1;
  var t = {x: Math.floor(v.X / 256), y: Math.floor(v.Y / 256), fx: v.X % 256, fy: v.Y % 256,
    mpp: tile(lat, lon, z).mpp / sc};
  var key = z + "/" + t.x + "/" + t.y + "/" + nx + "/" + ny, box = document.getElementById("tiles");
  // the pin, its ring and the coordinates at the position (off the anchor
  // when the view is centred on the day's track)
  var ids = ["acc", "pin", "coord"];
  for (var j = 0; j < 3; j++) {
    var s = document.getElementById(ids[j]).style;
    s.left = "calc(50% + " + ((me[0] - v.X) * sc).toFixed(1) + "px)";
    s.top = "calc(42% + " + ((me[1] - v.Y) * sc).toFixed(1) + "px)";
  }
  if (key !== mapKey) {
    var h = "";
    for (var dx = -nx; dx <= nx; dx++) for (var dy = -ny; dy <= ny; dy++)
      h += '<img alt="" src="https://tile.openstreetmap.org/' + z + "/" + (t.x + dx) + "/" + (t.y + dy) +
        '.png" style="left:' + dx * 256 + "px;top:" + dy * 256 + 'px">';
    box.innerHTML = h;
    mapKey = key;
  }
  box.style.transform = (sc < 1 ? "scale(" + sc.toFixed(4) + ") " : "") +
    "translate(" + (-t.fx).toFixed(1) + "px," + (-t.fy).toFixed(1) + "px)";
  var trk = document.getElementById("trk");
  trk.style.transform = box.style.transform;
  if (key + "/" + hist.pts.length + "/" + hist.hl !== trkKey) {
    trkKey = key + "/" + hist.pts.length + "/" + hist.hl;
    var hr = hlRange();
    trk.innerHTML = hist.pts.length ? '<svg width="1" height="1"><path d="' + histPath(t, z) + '"/>' +
      (hr ? '<path class="hl" d="' + histPath(t, z, hr[0], hr[1]) + '"/>' : "") + "</svg>" : "";
  }
  // the ring's radius: NAV-PVT's hAcc as it is, else HDOP * UERE
  var acc = document.getElementById("acc"), px = typeof d.hacc === "number" ? d.hacc * 2 / t.mpp :
    typeof d.hdop === "number" ? d.hdop * UERE * 2 / t.mpp : 0;
  acc.style.width = acc.style.height = Math.max(36, Math.round(px)) + "px";
}

var last = 0, every = 15, prevD = null, drawn = {};
// a box rewritten only when its HTML changed: drawn holds what was written
// (innerHTML reads back normalised, &middot; as U+00B7: it always differed)
function paint(v) {
  for (var id in v) {
    if (drawn[id] === v[id]) continue;
    var e = document.getElementById(id);
    if (e) { e.innerHTML = v[id]; drawn[id] = v[id]; }
  }
}
function stale() {
  document.body.className = "off";
  document.getElementById("live").innerHTML = last ? "OFFLINE &middot; " + esc(hms((Date.now() - last) / 1000).toUpperCase()) +
    " AGO" : "NO ANSWER";
}
function tick() {
  var x = new XMLHttpRequest();
  x.open("GET", "/status.json", true);
  x.timeout = 10000;
  x.onload = function () {
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) {
      stale();
      // the board answered, a bug building the JSON: its error
      if (x.status === 500) document.getElementById("live").innerHTML = "BOARD ERROR &middot; " +
        esc(String(x.responseText).slice(0, 60));
    }
    // a bug drawing a box is not the board gone: LIVE stays, the error shows
    if (d) try {
      every = d.refresh_s || 15;
      last = Date.now();
      document.body.className = "";
      document.getElementById("live").innerHTML = "LIVE";
      paint(view(d, prevD));
      prevD = d;
      boardDays = d.days || [];
      navPaint();
      placeMap(d);
      if (histDue()) histLoad();
      if (diagDue()) diagLoad();
    } catch (e) {
      document.getElementById("live").innerHTML = "LIVE &middot; PAGE ERROR " + esc(String(e && e.message || e)).slice(0, 60);
    }
    setTimeout(tick, every * 1000);
  };
  x.onerror = x.ontimeout = function () { stale(); setTimeout(tick, every * 1000); };
  x.send();
}
if (typeof document !== "undefined") {
  window.onresize = function () { if (mapD) placeMap(mapD); };
  tick();
}
</script>
</body>
