name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MICROPYTHON_VERSION: "1.29.0"

jobs:
  lint:
    name: pyflakes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      # every Python file of the repo (the board's modules, tools and tests)
      - run: python -m pyflakes gps_logger.py gps_clock.py gps_receiver.py gps_boot.py gps_tft.py gps_tft_font.py main.py tools tests

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # preinstalled on the ubuntu-24.04 runner image
      - run: shellcheck --version
      - run: shellcheck deploy.sh tools/build_firmware.sh

  mpy-cross:
    name: mpy-cross (xtensawin)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "mpy-cross==1.29.*"
      # every module the firmware freezes (tools/build_firmware.sh manifest)
      # and main.py: a construct xtensawin bytecode cannot take fails here,
      # not at the next local build
      - run: |
          for m in gps_logger gps_clock gps_receiver gps_boot gps_tft gps_tft_font main; do
            python -m mpy_cross -O3 -march=xtensawin -o "$RUNNER_TEMP/$m.mpy" "$m.py"
          done
      - run: ls -l "$RUNNER_TEMP"/*.mpy

  test:
    name: tests (CPython + MicroPython unix)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the page checks run web.html's script in node (a missing node is a
      # FAIL in CI, see tests/test_gps_logger.py PAGE): a pinned LTS, not
      # whatever the runner image ships
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node --version

      # MicroPython unix port: only built on a cache miss (~1-2 min), then
      # restored in a few seconds. Lets the suite run tests/mpy_unix_check.py.
      # A second build with single-precision floats, as on the board, runs
      # tests/mpy_unix_logger.py the way the board computes (MICROPYTHON_F32).
      - name: Cache MicroPython unix port
        id: mpy-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/micropython-bin
          key: micropython-unix-f32-${{ env.MICROPYTHON_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04

      - name: Build MicroPython unix port
        if: steps.mpy-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential libffi-dev pkg-config
          git clone --depth 1 --branch "v${MICROPYTHON_VERSION}" \
            https://github.com/micropython/micropython.git "$RUNNER_TEMP/micropython"
          make -C "$RUNNER_TEMP/micropython/mpy-cross" -j"$(nproc)"
          make -C "$RUNNER_TEMP/micropython/ports/unix" submodules
          make -C "$RUNNER_TEMP/micropython/ports/unix" -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/micropython-bin"
          cp "$RUNNER_TEMP/micropython/ports/unix/build-standard/micropython" \
            "$RUNNER_TEMP/micropython-bin/"
          make -C "$RUNNER_TEMP/micropython/ports/unix" -j"$(nproc)" \
            BUILD=build-f32 PROG=micropython-f32 \
            CFLAGS_EXTRA=-DMICROPY_FLOAT_IMPL=MICROPY_FLOAT_IMPL_FLOAT
          cp "$RUNNER_TEMP/micropython/ports/unix/build-f32/micropython-f32" \
            "$RUNNER_TEMP/micropython-bin/"

      - name: Run test suite
        run: |
          export MICROPYTHON="$RUNNER_TEMP/micropython-bin/micropython"
          export MICROPYTHON_F32="$RUNNER_TEMP/micropython-bin/micropython-f32"
          "$MICROPYTHON" -c "import sys; print(sys.version)"
          python3 tests/test_gps_logger.py
